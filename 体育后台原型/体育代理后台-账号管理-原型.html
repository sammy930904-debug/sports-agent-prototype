<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1280"/>
<title>体育代理后台 · 账号管理 原型</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html,body { background:#0F0F10; color:#FFFFFF; font-family: -apple-system, "Microsoft YaHei", system-ui, sans-serif; }
  .gold { color:#F0B93A; }
  .bg-gold { background:#F0B93A; color:#1F1F1F; }
  .bg-card { background:#1A1A1C; }
  .bg-elev { background:#0F0F10; }
  .bd { border-color:#2A2A2C; }
  .bd-gold { border-color:#F0B93A; }
  .muted { color:#8E8E93; }
  .danger { color:#FF4D4F; }
  .good { color:#34C759; }
  .input { background:#0F0F10; border:1px solid #2A2A2C; color:#fff; padding:8px 12px; border-radius:6px; outline:none; height:40px; }
  .input:focus { border-color:#F0B93A; }
  .btn-primary { background:#F0B93A; color:#1F1F1F; font-weight:600; padding:0 16px; height:40px; border-radius:6px; }
  .btn-primary:disabled { opacity:.4; cursor:not-allowed; }
  .btn-secondary { background:#3A3A3C; color:#fff; padding:0 16px; height:40px; border-radius:6px; }
  .btn-ghost { color:#F0B93A; padding:0 8px; }
  .chip { display:inline-block; padding:2px 10px; border-radius:9999px; font-size:12px; }
  .chip-on { background:rgba(52,199,89,.15); color:#34C759; }
  .chip-off { background:rgba(142,142,147,.2); color:#8E8E93; }
  .table-head { background:#1A1A1C; color:#8E8E93; }
  .row-hover:hover { background:#141416; }
  .divider { border-top:1px solid #2A2A2C; }
  .badge-title { background:linear-gradient(180deg,#2a2a2d,#1a1a1c); border:1px solid #F0B93A; color:#F0B93A; padding:6px 24px; border-radius:4px; font-weight:700; letter-spacing:2px; }
  .scroll::-webkit-scrollbar { width:8px; height:8px; }
  .scroll::-webkit-scrollbar-thumb { background:#3a3a3c; border-radius:4px; }
  .req::before { content:"*"; color:#FF4D4F; margin-right:4px; }
  .toast { position:fixed; top:24px; left:50%; transform:translateX(-50%); z-index:9999; background:#1A1A1C; border:1px solid #2A2A2C; color:#fff; padding:10px 18px; border-radius:6px; box-shadow:0 8px 28px rgba(0,0,0,.5); }
  .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:50; display:flex; align-items:center; justify-content:center; }
  details > summary { list-style:none; cursor:pointer; }
  details > summary::-webkit-details-marker { display:none; }
  /* 字段说明 hover 气泡 (Sammy 2026-05-11 拍: 跟 S 端一致, 字段表头鼠标移上显示业务规则气泡) */
  .field-hint{position:relative;cursor:help;border-bottom:1px dotted rgba(155,127,232,0.5)}
  .field-hint-bubble{padding:10px 14px;background:#1A1428;border:2px solid #9B7FE8;border-radius:8px;color:#FFFFFF;font-size:12px;line-height:1.65;min-width:260px;max-width:360px;z-index:99999;text-align:left;white-space:normal;box-shadow:0 8px 32px rgba(0,0,0,0.85),0 0 0 4px rgba(155,127,232,0.15);pointer-events:none;font-weight:normal;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .field-hint-bubble::before{content:"📝 业务规则";display:block;color:#C4A8FF;font-weight:700;margin-bottom:6px;font-size:11px;letter-spacing:.5px;padding-bottom:5px;border-bottom:1px solid rgba(155,127,232,0.4)}
  .field-hint-bubble::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:8px solid transparent;border-top-color:#9B7FE8}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react" src="js/app.js"></script>
</body>
</html>
