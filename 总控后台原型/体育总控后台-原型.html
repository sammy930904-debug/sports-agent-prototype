    .btn-primary{background:#4A9EFF;color:#fff}
    .btn-primary:hover{background:#5FA8FF}
    .btn-primary:disabled{background:#2A3648;color:#6B7280;cursor:not-allowed}
    .btn-ghost{background:transparent;color:#E6EAF0;border-color:#2A3648}
    .btn-ghost:hover{border-color:#4A9EFF;color:#4A9EFF}
    .btn-danger{background:#3A1F23;color:#FF6B6B;border-color:#5A2D33}
    .btn-danger:hover{background:#5A2D33}
    .input{background:#0B0F15;border:1px solid #2A3648;border-radius:6px;padding:8px 12px;font-size:13px;color:#E6EAF0;width:100%}
    .input:focus{border-color:#4A9EFF;outline:none}
    .chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;font-weight:500}
    .chip-active{background:#0F2A1A;color:#5BC97C}
    .chip-frozen{background:#3A1F23;color:#FF6B6B}
    .chip-pending{background:#2A2415;color:#F0B93A}
    .chip-settled{background:#0F2A1A;color:#5BC97C}
    .chip-void{background:#2A2A30;color:#9AA4B5}
    .chip-cool{background:#0F1B2A;color:#4A9EFF}
    .chip-warn{background:#2A2415;color:#F0B93A}
    .chip-info{background:#1A2434;color:#9AA4B5}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th{text-align:left;padding:10px 12px;background:#0F141C;color:#9AA4B5;font-weight:500;border-bottom:1px solid #2A3648;white-space:nowrap}
    td{padding:10px 12px;border-bottom:1px solid #1F2733;white-space:nowrap}
    tr:hover td{background:#141B25}
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50}
    .modal{background:#11161E;border:1px solid #2A3648;border-radius:10px;padding:24px;width:480px;max-width:92vw;max-height:90vh;overflow:auto}
    .modal-wide{width:720px}
    .section-title{font-size:12px;color:#F0B93A;font-weight:600;margin:14px 0 8px 0}
    .section-title:first-child{margin-top:0}
    .menu-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:13px;color:#9AA4B5;transition:.15s}
    .menu-item:hover{background:#1A2434;color:#E6EAF0}
    .menu-item.active{background:#0F1B2A;color:#4A9EFF}
    .menu-group{font-size:11px;color:#6B7280;padding:14px 12px 6px;letter-spacing:1px;font-weight:500}
    .tab{padding:8px 16px;font-size:13px;color:#9AA4B5;cursor:pointer;border-bottom:2px solid transparent;transition:.15s}
    .tab.active{color:#4A9EFF;border-bottom-color:#4A9EFF}
    .scroll-x{overflow-x:auto}
    .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
    .mono{font-family:"SF Mono",Monaco,Consolas,monospace}

    const fmtAmount = (n) => {

    function AgentsPage({ role, canWrite }) {
      const [modal, setModal] = useState(null);
      const [expanded, setExpanded] = useState(new Set());
      // mock 数据放 state 里, 让"新增下线"等动作能真更新列表
      const [accounts, setAccounts] = useState(() => ({...ACCOUNTS}));
      const [topKeys, setTopKeys] = useState(() => [...TOP_AGENT_KEYS]);
      const cols = ROLES[role].agentCols;
      // 新增下线: 派生 sysId / 加节点 / 更新父级 children / 沿祖先链 +subCount
      const handleNewSub = (parent, data) => {
        const next = {...accounts};
        const parentKey = parent.key;
        const parentNode = next[parentKey];
        if (!parentNode) return;
        const childSeq = (parentNode.children || []).length + 1;
        const newSysId = parentNode.sysId + "-" + childSeq;
        const newKey = data.user + "::" + data.currency;
        if (next[newKey]) { alert("用户账号 + 币种已存在: " + newKey); return; }
        const now = new Date();
        const pad = (n) => String(n).padStart(2, "0");
        const createdAt = now.getFullYear() + "-" + pad(now.getMonth()+1) + "-" + pad(now.getDate()) + " " + pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
        next[newKey] = {
          sysId: newSysId, user: data.user, accountType: data.type, currency: data.currency,
          shareRatio: data.shareRatio, balance: 0, subBalance: 0, totalBalance: 0,
          subCount: 0, status: data.status, createdAt, children: [],
        };
        next[parentKey] = { ...parentNode, children: [...(parentNode.children || []), newKey], subCount: (parentNode.subCount || 0) + 1 };
        // 沿祖先链 +1 subCount (穿透口径)
        let cursor = parentKey;
        while (true) {
          let found = null;
          for (const [k, n] of Object.entries(next)) {
            if (k !== cursor && n.children && n.children.includes(cursor)) { found = k; break; }
          }
          if (!found) break;
          next[found] = { ...next[found], subCount: (next[found].subCount || 0) + 1 };
          cursor = found;
        }
        setAccounts(next);
        // 自动展开父级让用户看到新行
        const ne = new Set(expanded); ne.add(parentKey); setExpanded(ne);
        setModal(null);
      };
      // 所有筛选走"输入态 + 提交后生效"双状态 (跟搜索按钮一起触发, ProComponents QueryFilter 模式)
      const [inSearch, setInSearch] = useState(""), [search, setSearch] = useState("");
      const [inStatus, setInStatus] = useState("all"), [statusFilter, setStatusFilter] = useState("all");
      const [inCurrency, setInCurrency] = useState("all"), [currencyFilter, setCurrencyFilter] = useState("all");
      const [inShareRatio, setInShareRatio] = useState("all"), [shareRatioFilter, setShareRatioFilter] = useState("all");
      const [inDateFrom, setInDateFrom] = useState(""), [dateFrom, setDateFrom] = useState("");
      const [inDateTo, setInDateTo] = useState(""), [dateTo, setDateTo] = useState("");
      const doSearch = () => {
        setSearch(inSearch.trim()); setStatusFilter(inStatus); setCurrencyFilter(inCurrency);
        setShareRatioFilter(inShareRatio); setDateFrom(inDateFrom); setDateTo(inDateTo);
      };
      const resetSearch = () => {
        setInSearch(""); setInStatus("all"); setInCurrency("all"); setInShareRatio("all"); setInDateFrom(""); setInDateTo("");
        setSearch(""); setStatusFilter("all"); setCurrencyFilter("all"); setShareRatioFilter("all"); setDateFrom(""); setDateTo("");
      };

      // Tree 扁平化: 顶代行先过筛选; 下线行只在父级展开时才出现 (V0.1 同款懒加载)
      // 搜索逻辑: 树状穿透 - 任何后代匹配, 整条祖先链都显示并自动展开 (大小写不敏感)
      const rows = useMemo(() => {
        const out = [];
        const ls = (search || "").toLowerCase().trim();
        const matches = (node) => !ls || node.user.toLowerCase().includes(ls) || node.sysId.toLowerCase().includes(ls);
        // 当前节点或任意后代匹配 (用于决定是否显示顶代行 / 是否强制展开)
        const hasMatchInSubtree = (key) => {
          const node = accounts[key];
          if (!node) return false;
          if (matches(node)) return true;
          return (node.children || []).some(c => hasMatchInSubtree(c));
        };
        function walk(key, depth) {
          const node = accounts[key];
          if (!node) return;
          if (depth === 0) {
            if (statusFilter !== "all" && node.status !== statusFilter) return;
            if (currencyFilter !== "all" && node.currency !== currencyFilter) return;
            if (shareRatioFilter !== "all") {
              const r = node.shareRatio;
              if (r == null) return;
              if (shareRatioFilter === "lt10" && r >= 0.10) return;
              if (shareRatioFilter === "10to20" && (r < 0.10 || r >= 0.20)) return;
              if (shareRatioFilter === "20to30" && (r < 0.20 || r >= 0.30)) return;
              if (shareRatioFilter === "gte30" && r < 0.30) return;
            }
            // datetime-local step=1 时返回 YYYY-MM-DDTHH:mm:ss (19 字符), 否则 YYYY-MM-DDTHH:mm (16 字符)
            // createdAt 是 "YYYY-MM-DD HH:mm:ss", 比较前 normalize: replace T + 必要时补秒
            if (dateFrom) {
              let fromCmp = dateFrom.replace("T", " ");
              if (fromCmp.length === 16) fromCmp += ":00";
              if (node.createdAt < fromCmp) return;
            }
            if (dateTo) {
              let toCmp = dateTo.replace("T", " ");
              if (toCmp.length === 16) toCmp += ":59";
              if (node.createdAt > toCmp) return;
            }
            if (ls && !hasMatchInSubtree(key)) return;
          }
          out.push({ ...node, key, depth });
          const autoExpand = ls && (node.children || []).some(c => hasMatchInSubtree(c));
          const shouldExpand = expanded.has(key) || autoExpand;
          if (shouldExpand) {
            (node.children || []).forEach(child => walk(child, depth + 1));
          }
        }
        topKeys.forEach(k => walk(k, 0));
        return out;
      }, [accounts, topKeys, search, statusFilter, currencyFilter, shareRatioFilter, dateFrom, dateTo, expanded]);

      const toggle = (key) => {
        const next = new Set(expanded);

      // 字段集 (Sammy 2026-04-29 拍 13 列, 砍昵称/佣金率上限/本月投注/本月佣金/最近登录入详情)

    function NewSubModal({ parent, accounts, onClose, onSubmit }) {
      const isTopParent = parent.accountType === "普通(顶代)";
      const topSchemes = isTopParent
        ? Object.values(accounts).filter(n => n.user === parent.user && n.accountType === "普通(顶代)")
        : [];
      const [user, setUser] = useState("");
      const [nick, setNick] = useState("");
      const [pwd, setPwd] = useState("");
      const [pwdC, setPwdC] = useState("");
      const [phone, setPhone] = useState("");
      const [phone2, setPhone2] = useState("");
      const [accType, setAccType] = useState("代理");
      const [accStatus, setAccStatus] = useState("active");
      const [schemeIdx, setSchemeIdx] = useState(0);
      const [rate, setRate] = useState("");
      const [opPwd, setOpPwd] = useState("");
      const [err, setErr] = useState("");

      const submit = () => {
        if (!/^[A-Za-z0-9]{6,20}$/.test(user)) { setErr("用户账号需 6-20 位英文+数字"); return; }
        if (!nick.trim()) { setErr("请输入账户昵称"); return; }
        if (!pwd) { setErr("请输入登录密码"); return; }
        if (pwd !== pwdC) { setErr("两次密码不一致"); return; }
        if (rate === "" || isNaN(+rate)) { setErr("请输入显示佣金率"); return; }
        if (opPwd !== "123456") { setErr("操作密码错误 (Mock: 123456)"); return; }
        const targetCurrency = isTopParent ? topSchemes[schemeIdx].currency : parent.currency;
        onSubmit({
          user, nick, type: accType, status: accStatus,
          currency: targetCurrency,
          shareRatio: +rate / 100, // 显示佣金率作为下线 shareRatio mock
        });
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal modal-wide" onClick={e=>e.stopPropagation()}>
            <h3 className="text-base font-semibold mb-1">新增下线:{parent.user} 下挂</h3>

                <div className="mt-1 text-faint" style={{fontSize:11}}>系统户口号永不回收、永不复用、永不变更</div>

              <div className="section-title">② 基本信息</div>

                <div><label className="block text-xs text-muted mb-1">用户账号 *</label><input className="input" placeholder="6-20 位英数" value={user} onChange={e=>setUser(e.target.value)}/></div>
                <div><label className="block text-xs text-muted mb-1">账户昵称 *</label><input className="input" value={nick} onChange={e=>setNick(e.target.value)}/></div>
                <div><label className="block text-xs text-muted mb-1">密码 *</label><input type="password" className="input" value={pwd} onChange={e=>setPwd(e.target.value)}/></div>
                <div><label className="block text-xs text-muted mb-1">确认密码 *</label><input type="password" className="input" value={pwdC} onChange={e=>setPwdC(e.target.value)}/></div>
                <div><label className="block text-xs text-muted mb-1">电话号码</label><input className="input" placeholder="选填" value={phone} onChange={e=>setPhone(e.target.value)}/></div>
                <div><label className="block text-xs text-muted mb-1">备用电话</label><input className="input" placeholder="选填" value={phone2} onChange={e=>setPhone2(e.target.value)}/></div>
              </div>

              <div className="section-title">③ 账号属性</div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs text-muted mb-1">账号类型 *</label>
                  <div className="flex gap-4 text-sm" style={{paddingTop:6}}>
                    <label><input type="radio" checked={accType==="代理"} onChange={()=>setAccType("代理")}/> <span className="ml-1">代理</span></label>
                    <label><input type="radio" checked={accType==="游戏"} onChange={()=>setAccType("游戏")}/> <span className="ml-1">游戏(玩家)</span></label>
                  </div>
                </div>
                <div>
                  <label className="block text-xs text-muted mb-1">账号状态 *</label>
                  <div className="flex gap-4 text-sm" style={{paddingTop:6}}>
                    <label><input type="radio" checked={accStatus==="active"} onChange={()=>setAccStatus("active")}/> <span className="ml-1">启用</span></label>
                    <label><input type="radio" checked={accStatus==="frozen"} onChange={()=>setAccStatus("frozen")}/> <span className="ml-1">禁用</span></label>
                  </div>
                </div>
              </div>

              <div className="section-title">④ 交收方案(单选)</div>
              {isTopParent ? (
                <div className="bg-card border border-line rounded overflow-hidden">
                  <table style={{width:"100%",fontSize:12}}>
                    <thead>
                      <tr style={{background:"#0F141C"}}>

                        <th style={{padding:"6px",fontWeight:500,color:"#9AA4B5",textAlign:"left"}}>币种</th>
                        <th style={{padding:"6px",fontWeight:500,color:"#9AA4B5",textAlign:"left"}}>占成</th>

                      </tr>

                    <tbody>

                          <td style={{padding:"8px 6px"}} className="num">{fmtPct(s.shareRatio)}</td>

                    </tbody>

                  <div className="text-faint" style={{fontSize:11,padding:"6px 8px",borderTop:"1px solid #1F2733"}}>下线创建后终身单一币种 / 单一交收方案,切换须走切币种高危流程。</div>
                </div>
              ) : (
                <div className="bg-card border border-line rounded p-3 text-xs">
                  <div>下线账号继承上级交收方案,不可更换</div>
                  <div className="text-muted mt-1">币种:<span className="chip chip-cool">{parent.currency}</span>  ·  占成:{parent.shareRatio == null ? "—" : fmtPct(parent.shareRatio) + " (参考)"}</div>
                </div>
              )}

              <div className="section-title">⑤ 游戏条件(显示佣金率)</div>
              <div>
                <label className="block text-xs text-muted mb-1">显示佣金率 *</label>
                <div className="flex items-center gap-2">
                  <input type="number" step="0.01" className="input flex-1" value={rate} onChange={e=>setRate(e.target.value)} placeholder="例: 12.5"/>

                <div className="text-faint mt-1" style={{fontSize:11}}>上限继承上级;代理与玩家均必填。本字段在该下线的「占成」列显示(参考)。</div>

              <div className="section-title">⑥ 安全校验</div>
              <div>
                <label className="block text-xs text-muted mb-1">操作密码 *</label>

              </div>
              {err && <div className="text-xs" style={{color:"#FF6B6B"}}>{err}</div>}

            <div className="flex justify-end gap-2 mt-5">
              <button className="btn btn-ghost" onClick={onClose}>取消</button>
              <button className="btn btn-primary" onClick={submit}>确认提交</button>
            </div>
          </div>
        </div>
      );
    }

            <div>
              <h2 className="text-xl font-semibold">交易流水记录</h2>
              <p className="text-xs text-muted mt-1">三层资金动作合一  ·  账房上下分 / 代理后台内部上下分 / 三方平台 转入转出</p>
            </div>
            <button className="btn btn-ghost">导出 CSV</button>
          </div>
          <div className="bg-panel border border-line rounded-lg p-4 mb-4 flex gap-3 items-center">
            <select className="input w-56" value={type} onChange={e=>setType(e.target.value)}>
              <option value="all">全部类型</option>
              <option value="house_credit">账房上分</option><option value="house_debit">账房下分</option>
              <option value="agent_credit">代理上分</option><option value="agent_debit">代理下分</option>
              <option value="transfer_in">转入三方</option><option value="transfer_out">三方回收</option>
            </select>
            <span className="text-xs text-faint">共 {list.length} 条</span>
          </div>
          <div className="bg-panel border border-line rounded-lg overflow-hidden">
            <div className="scroll-x">
              <table>
                <thead><tr>
                  <th>流水号</th><th>分类</th><th>类型</th><th>方向 / 操作</th><th>来源</th><th>去向</th><th>币种</th><th className="text-right">金额</th><th>时间</th><th>状态</th>
                </tr></thead>
                <tbody>
                  {list.map(l => (
                    <tr key={l.id}>
                      <td className="mono text-cool" style={{fontSize:11}}>{l.id}</td>
                      <td><span className="chip chip-info" style={{fontSize:10}}>{groupLabel[l.type]}</span></td>
                      <td>{l.typeLabel}</td>
                      <td className="text-faint">{l.type.includes("credit") || l.type === "transfer_in" ? "↑ 入" : "↓ 出"}</td>
                      <td className="text-muted" style={{fontSize:12}}>{l.from}</td>
                      <td className="text-muted" style={{fontSize:12}}>{l.to}</td>
                      <td><span className="chip chip-cool">{l.currency}</span></td>
                      <td className="num text-right">{fmtAmount(l.amount)}</td>
                      <td className="text-muted" style={{fontSize:12}}>{l.time}</td>
                      <td><span className={"chip " + (l.status === "成功" ? "chip-active" : "chip-warn")}>{l.status}</span></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ============== 操作日志页 ==============
    function AuditPage({ role }) {
      const [tab, setTab] = useState("system");
      const data = tab === "system" ? MOCK_AUDIT_SYSTEM : MOCK_AUDIT_PLAYER;

      return (
        <div className="p-6">
          <div className="mb-5">
            <h2 className="text-xl font-semibold">操作日志</h2>
            <p className="text-xs text-muted mt-1">系统 = 平台员工动作  ·  玩家 = C 端玩家 + B 端代理动作 (在 S 端视角下,代理也是被管对象)</p>
          </div>
          <div className="border-b border-line mb-4 flex">
            <div className={"tab " + (tab==="system"?"active":"")} onClick={()=>setTab("system")}>系统 ({MOCK_AUDIT_SYSTEM.length})</div>
            <div className={"tab " + (tab==="player"?"active":"")} onClick={()=>setTab("player")}>玩家 ({MOCK_AUDIT_PLAYER.length})</div>
          </div>
          <div className="bg-panel border border-line rounded-lg overflow-hidden">
            <div className="scroll-x">
              <table>
                <thead><tr>
                  <th>时间</th><th>主体类型</th><th>主体</th><th>动作</th><th>目标</th><th>IP</th><th>{tab === "system" ? "审计原因" : "备注"}</th>
                </tr></thead>
                <tbody>
                  {data.map((r, i) => (
                    <tr key={i}>
                      <td className="text-muted" style={{fontSize:12}}>{r.time}</td>
                      <td><span className={"chip " + (r.actorType === "员工" ? "chip-cool" : (r.actorType === "代理" ? "chip-warn" : "chip-info"))}>{r.actorType}</span></td>
                      <td className="mono">{r.actor}</td>
                      <td>{r.action}</td>
                      <td className="text-muted" style={{fontSize:12}}>{r.target}</td>
                      <td className="mono text-faint" style={{fontSize:11}}>{r.ip}</td>
                      <td className="text-muted" style={{fontSize:12}}>{r.reason}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ============== 主框架 ==============
    function App() {
      const [role, setRole] = useState("operator");
      const [active, setActive] = useState("agents");
      const r = ROLES[role];
      const visibleMenus = r.menus;

      // 角色切换后兜底:若当前菜单不可见,回退到第一个可见菜单
      React.useEffect(() => {
        if (!visibleMenus.includes(active)) setActive(visibleMenus[0]);
      }, [role]);

      const Menu = ({ id, label, icon }) => visibleMenus.includes(id) && (
        <div className={"menu-item " + (active===id?"active":"")} onClick={()=>setActive(id)}>
          <span style={{width:14}}>{icon}</span>{label}
        </div>
      );

      return (
        <div className="flex min-h-screen">
          {/* Sidebar */}
          <aside className="w-56 bg-panel border-r border-line flex flex-col">
            <div className="px-5 py-5 border-b border-line">
              <div className="flex items-center gap-2">
                <span className="text-cool text-lg">◆</span>
                <span className="font-semibold tracking-wider" style={{letterSpacing:2}}>体育游戏</span>
              </div>
              <div className="text-xs text-faint mt-1 ml-5">总控后台 V0.2</div>
            </div>
            <nav className="flex-1 px-3 py-3 overflow-y-auto">
              <div className="menu-group">账号管理</div>
              <Menu id="agents" label="顶代户口" icon="◉"/>

              <div className="menu-group">报表管理</div>
              <Menu id="reports.bets" label="注单记录" icon="◐"/>
              <Menu id="reports.sports" label="体育场次记录" icon="◑"/>
              <Menu id="reports.ledger" label="交易流水记录" icon="◒"/>

              <div className="menu-group">系统管理</div>
              <Menu id="sys.audit" label="操作日志" icon="◓"/>
            </nav>
            <div className="px-4 py-3 border-t border-line text-xs text-faint">
              <div>内部工具 · 仅限授权员工</div>
              <div className="mt-1" style={{fontSize:10,color:"#5C6878"}}>原型仅评审用 · 实际开发使用 @ant-design/pro-components</div>
            </div>
          </aside>

          {/* Main */}
          <main className="flex-1 flex flex-col bg-app">
            <header className="border-b border-line px-6 py-3 flex items-center justify-between bg-panel">
              <div className="text-xs text-faint">
                {active === "agents" && "账号管理 / 顶代户口"}
                {active === "reports.bets" && "报表管理 / 注单记录"}
                {active === "reports.sports" && "报表管理 / 体育场次记录"}
                {active === "reports.ledger" && "报表管理 / 交易流水记录"}
                {active === "sys.audit" && "系统管理 / 操作日志"}
              </div>
              <div className="flex items-center gap-3">
                <span className="text-xs text-muted">当前角色</span>
                <select className="input w-32" value={role} onChange={e=>setRole(e.target.value)} style={{padding:"6px 10px"}}>
                  <option value="operator">平台运营</option>
                  <option value="risk">风控审计</option>
                  <option value="finance">财务对账</option>
                </select>
                <span className="chip chip-cool">{r.desc}</span>
                <span className="text-xs text-muted">admin@platform</span>
              </div>
            </header>
            <div className="flex-1 overflow-auto">
              {active === "agents" && <AgentsPage role={role} canWrite={r.canWrite}/>}
              {active === "reports.bets" && <BetsPage role={role}/>}
              {active === "reports.sports" && <SportsSessionsPage role={role}/>}
              {active === "reports.ledger" && <LedgerPage role={role}/>}
              {active === "sys.audit" && <AuditPage role={role}/>}
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
