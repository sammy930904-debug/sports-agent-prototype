    .bg-panel{background:#11161E}

    .bg-row-hover:hover{background:#1A2434}

    .text-faint{color:#6B7280}
    .text-cool{color:#4A9EFF}

    .bg-cool-soft{background:#0F1B2A}
    .border-cool{border-color:#4A9EFF}
    .ring-cool:focus{outline:2px solid #4A9EFF;outline-offset:1px}
    .btn{padding:8px 14px;border-radius:6px;font-size:13px;font-weight:500;transition:.15s;cursor:pointer;border:1px solid transparent}
    .btn-primary{background:#4A9EFF;color:#fff}
    .btn-primary:hover{background:#5FA8FF}
    .btn-primary:disabled{background:#2A3648;color:#6B7280;cursor:not-allowed}
    .btn-ghost{background:transparent;color:#E6EAF0;border-color:#2A3648}
    .btn-ghost:hover{border-color:#4A9EFF;color:#4A9EFF}
    .btn-danger{background:#3A1F23;color:#FF6B6B;border-color:#5A2D33}
    .btn-danger:hover{background:#5A2D33}
    .input{background:#0B0F15;border:1px solid #2A3648;border-radius:6px;padding:8px 12px;font-size:13px;color:#E6EAF0;width:100%}
    .input:focus{border-color:#4A9EFF;outline:none}
    .chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;font-weight:500}
    .chip-active{background:#0F2A1A;color:#5BC97C}
    .chip-frozen{background:#3A1F23;color:#FF6B6B}
    .chip-pending{background:#2A2415;color:#F0B93A}
    .chip-settled{background:#0F2A1A;color:#5BC97C}
    .chip-void{background:#2A2A30;color:#9AA4B5}
    .chip-cool{background:#0F1B2A;color:#4A9EFF}
    .chip-warn{background:#2A2415;color:#F0B93A}
    .chip-info{background:#1A2434;color:#9AA4B5}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th{text-align:left;padding:10px 12px;background:#0F141C;color:#9AA4B5;font-weight:500;border-bottom:1px solid #2A3648;white-space:nowrap}
    td{padding:10px 12px;border-bottom:1px solid #1F2733;white-space:nowrap}
    tr:hover td{background:#141B25}
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50}
    .modal{background:#11161E;border:1px solid #2A3648;border-radius:10px;padding:24px;width:480px;max-width:92vw;max-height:90vh;overflow:auto}
    .menu-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:13px;color:#9AA4B5;transition:.15s}
    .menu-item:hover{background:#1A2434;color:#E6EAF0}
    .menu-item.active{background:#0F1B2A;color:#4A9EFF}
    .menu-group{font-size:11px;color:#6B7280;padding:14px 12px 6px;letter-spacing:1px;font-weight:500}
    .tab{padding:8px 16px;font-size:13px;color:#9AA4B5;cursor:pointer;border-bottom:2px solid transparent;transition:.15s}
    .tab.active{color:#4A9EFF;border-bottom-color:#4A9EFF}
    .scroll-x{overflow-x:auto}
    .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
    .mono{font-family:"SF Mono",Monaco,Consolas,monospace}

    const fmtNum = (n, dec=0) => {
      if (n === 0) return "0";
      if (typeof n !== "number") return n;
      return n.toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec });
    };
    const fmtMoney = (n, cur) => {
      const dec = (cur === "USD" || cur === "PHP") ? 2 : 0;
      const sign = n < 0 ? "-" : "";
      return sign + fmtNum(Math.abs(n), dec) + " " + cur;
    };
    const fmtPct = (n) => (n * 100).toFixed(2) + "%";

      const map = { active:"chip-active", frozen:"chip-frozen", pending:"chip-pending", settled:"chip-settled", void:"chip-void", "未结算":"chip-pending", "已结算":"chip-settled" };
      const txt = { active:"启用", frozen:"已冻结", pending:"待处理", settled:"已结算", void:"作废" };
      return <span className={"chip " + (map[status] || "chip-info")}>{txt[status] || status}</span>;

    function AgentsPage({ role, canWrite }) {
      const [search, setSearch] = useState("");

      const [modal, setModal] = useState(null);
      const [expanded, setExpanded] = useState(new Set());
      const cols = ROLES[role].agentCols;

      // Tree 扁平化: 顶代行先过筛选; 下线行只在父级展开时才出现 (V0.1 同款懒加载)
      const rows = useMemo(() => {
        const out = [];
        function walk(key, depth) {
          const node = ACCOUNTS[key];
          if (!node) return;
          if (depth === 0) {
            if (statusFilter !== "all" && node.status !== statusFilter) return;
            if (search && !(node.user.includes(search) || node.sysId.toLowerCase().includes(search.toLowerCase()))) return;
          }
          out.push({ ...node, key, depth });
          if (expanded.has(key)) {
            (node.children || []).forEach(child => walk(child, depth + 1));
          }
        }
        TOP_AGENT_KEYS.forEach(k => walk(k, 0));
        return out;
      }, [search, statusFilter, expanded]);

      const toggle = (key) => {
        const next = new Set(expanded);
        if (next.has(key)) next.delete(key); else next.add(key);
        setExpanded(next);
      };

                      <td className="num text-right">{fmtMoney(b.stake, b.currency)}</td>
                      {showFinanceCols && <td className="num text-right">{b.status==="未结算"?<span className="text-faint">—</span>:fmtMoney(b.payout, b.currency)}</td>}
                      {showFinanceCols && <td className="num text-right" style={{color: b.status==="未结算" ? "#9AA4B5" : (b.winLoss > 0 ? "#5BC97C" : (b.winLoss < 0 ? "#FF6B6B" : "#9AA4B5"))}}>
                        {b.status==="未结算" ? "—" : (b.winLoss > 0 ? "+" : "") + fmtMoney(b.winLoss, b.currency)}
                      </td>}
                      <td><StatusChip status={b.status}/></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ============== 体育场次记录页 ==============
    function SportsSessionsPage({ role }) {
      const [date, setDate] = useState("all");
      const [topAgent, setTopAgent] = useState("all");

      const list = MOCK_SPORTS_SESSIONS.filter(s => {
        if (date !== "all" && s.date !== date) return false;
        if (topAgent !== "all" && s.topAgent !== topAgent) return false;
        return true;
      });

      return (
        <div className="p-6">
          <div className="flex items-center justify-between mb-5">
            <div>
              <h2 className="text-xl font-semibold">体育场次记录</h2>
              <p className="text-xs text-muted mt-1">每日 02:30 跑批 1 次,只统计体育已结算注单  ·  用于代理佣金结算</p>
            </div>
            <button className="btn btn-ghost">导出 CSV</button>
          </div>
          <div className="bg-cool-soft border border-cool rounded-lg p-3 mb-4 text-xs flex items-center gap-2">
            <span className="text-cool">ℹ</span>
            <span>电子 / 六合彩 的代理佣金结算暂未实现 (Q-S1 待议),本页仅体育数据</span>
          </div>
          <div className="bg-panel border border-line rounded-lg p-4 mb-4 flex gap-3 items-center">
            <select className="input w-40" value={date} onChange={e=>setDate(e.target.value)}>
              <option value="all">全部日期</option><option value="2026-04-28">2026-04-28</option><option value="2026-04-27">2026-04-27</option>
            </select>
            <select className="input w-40" value={topAgent} onChange={e=>setTopAgent(e.target.value)}>
              <option value="all">全部顶代</option>{TOP_AGENTS.map(a => <option key={a.id} value={a.id}>{a.id} ({a.nick})</option>)}
            </select>
            <span className="text-xs text-faint">共 {list.length} 条 · 总佣金 <span className="text-cool num">{fmtNum(list.reduce((s,r)=>s+r.commission,0))}</span></span>
          </div>
          <div className="bg-panel border border-line rounded-lg overflow-hidden">
            <div className="scroll-x">
              <table>
                <thead><tr>
                  <th>场次 ID</th><th>业务日期</th><th>顶代</th><th className="text-right">注单数</th><th className="text-right">玩家数</th>
                  <th className="text-right">总投注</th><th className="text-right">有效投注</th><th className="text-right">总输赢</th>
                  <th className="text-right">佣金率</th><th className="text-right">佣金金额</th><th>状态</th><th>生成时间</th><th>批次号</th>
                </tr></thead>
                <tbody>
                  {list.map(s => (
                    <tr key={s.id}>
                      <td className="mono text-cool" style={{fontSize:11}}>{s.id}</td>
                      <td>{s.date}</td>
                      <td><span className="mono">{s.topAgent}</span> <span className="text-faint">({s.topNick})</span></td>
                      <td className="num text-right">{fmtNum(s.betCount)}</td>
                      <td className="num text-right">{fmtNum(s.playerCount)}</td>
                      <td className="num text-right">{fmtNum(s.totalStake)}</td>
                      <td className="num text-right">{fmtNum(s.validStake)}</td>
                      <td className="num text-right" style={{color: s.totalWinLoss > 0 ? "#5BC97C" : (s.totalWinLoss < 0 ? "#FF6B6B" : "#9AA4B5")}}>
                        {s.totalWinLoss > 0 ? "+" : ""}{fmtNum(s.totalWinLoss)}
                      </td>
                      <td className="num text-right">{fmtPct(s.rate)}</td>
                      <td className="num text-right text-cool">{fmtNum(s.commission)}</td>
                      <td><StatusChip status={s.status}/></td>
                      <td className="text-muted" style={{fontSize:11}}>{s.batchTime}</td>
                      <td className="mono text-faint" style={{fontSize:11}}>{s.batchId}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ============== 交易流水记录页 ==============
    function LedgerPage({ role }) {
      const [type, setType] = useState("all");

      const list = MOCK_LEDGER.filter(l => type === "all" || l.type === type);

      const groupLabel = {
        house_credit: "账房 ↔ 顶代",
        house_debit: "账房 ↔ 顶代",
        agent_credit: "代理后台内部",
        agent_debit: "代理后台内部",
        transfer_in: "代理 / 玩家 ↔ 三方平台",
        transfer_out: "代理 / 玩家 ↔ 三方平台",
      };

      return (
        <div className="p-6">
          <div className="flex items-center justify-between mb-5">
            <div>
              <h2 className="text-xl font-semibold">交易流水记录</h2>
              <p className="text-xs text-muted mt-1">三层资金动作合一  ·  账房上下分 / 代理后台内部上下分 / 三方平台 转入转出</p>
            </div>
            <button className="btn btn-ghost">导出 CSV</button>
          </div>
          <div className="bg-panel border border-line rounded-lg p-4 mb-4 flex gap-3 items-center">
            <select className="input w-56" value={type} onChange={e=>setType(e.target.value)}>
              <option value="all">全部类型</option>
              <option value="house_credit">账房上分</option><option value="house_debit">账房下分</option>
              <option value="agent_credit">代理上分</option><option value="agent_debit">代理下分</option>
              <option value="transfer_in">转入三方</option><option value="transfer_out">三方回收</option>
            </select>
            <span className="text-xs text-faint">共 {list.length} 条</span>
          </div>
          <div className="bg-panel border border-line rounded-lg overflow-hidden">
            <div className="scroll-x">
              <table>
                <thead><tr>
                  <th>流水号</th><th>分类</th><th>类型</th><th>方向 / 操作</th><th>来源</th><th>去向</th><th className="text-right">金额</th><th>时间</th><th>状态</th>
                </tr></thead>
                <tbody>
                  {list.map(l => (
                    <tr key={l.id}>
                      <td className="mono text-cool" style={{fontSize:11}}>{l.id}</td>
                      <td><span className="chip chip-info" style={{fontSize:10}}>{groupLabel[l.type]}</span></td>
                      <td>{l.typeLabel}</td>
                      <td className="text-faint">{l.type.includes("credit") || l.type === "transfer_in" ? "↑ 入" : "↓ 出"}</td>
                      <td className="text-muted" style={{fontSize:12}}>{l.from}</td>
                      <td className="text-muted" style={{fontSize:12}}>{l.to}</td>
                      <td className="num text-right">{fmtMoney(l.amount, l.currency)}</td>
                      <td className="text-muted" style={{fontSize:12}}>{l.time}</td>
                      <td><span className={"chip " + (l.status === "成功" ? "chip-active" : "chip-warn")}>{l.status}</span></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ============== 操作日志页 ==============
    function AuditPage({ role }) {
      const [tab, setTab] = useState("system");
      const data = tab === "system" ? MOCK_AUDIT_SYSTEM : MOCK_AUDIT_PLAYER;

      return (
        <div className="p-6">
          <div className="mb-5">
            <h2 className="text-xl font-semibold">操作日志</h2>
            <p className="text-xs text-muted mt-1">系统 = 平台员工动作  ·  玩家 = C 端玩家 + B 端代理动作 (在 S 端视角下,代理也是被管对象)</p>
          </div>
          <div className="border-b border-line mb-4 flex">
            <div className={"tab " + (tab==="system"?"active":"")} onClick={()=>setTab("system")}>系统 ({MOCK_AUDIT_SYSTEM.length})</div>
            <div className={"tab " + (tab==="player"?"active":"")} onClick={()=>setTab("player")}>玩家 ({MOCK_AUDIT_PLAYER.length})</div>
          </div>
          <div className="bg-panel border border-line rounded-lg overflow-hidden">
            <div className="scroll-x">
              <table>
                <thead><tr>
                  <th>时间</th><th>主体类型</th><th>主体</th><th>动作</th><th>目标</th><th>IP</th><th>{tab === "system" ? "审计原因" : "备注"}</th>
                </tr></thead>
                <tbody>
                  {data.map((r, i) => (
                    <tr key={i}>
                      <td className="text-muted" style={{fontSize:12}}>{r.time}</td>
                      <td><span className={"chip " + (r.actorType === "员工" ? "chip-cool" : (r.actorType === "代理" ? "chip-warn" : "chip-info"))}>{r.actorType}</span></td>
                      <td className="mono">{r.actor}</td>
                      <td>{r.action}</td>
                      <td className="text-muted" style={{fontSize:12}}>{r.target}</td>
                      <td className="mono text-faint" style={{fontSize:11}}>{r.ip}</td>
                      <td className="text-muted" style={{fontSize:12}}>{r.reason}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ============== 主框架 ==============
    function App() {
      const [role, setRole] = useState("operator");
      const [active, setActive] = useState("agents");
      const r = ROLES[role];
      const visibleMenus = r.menus;

      // 角色切换后兜底:若当前菜单不可见,回退到第一个可见菜单
      React.useEffect(() => {
        if (!visibleMenus.includes(active)) setActive(visibleMenus[0]);
      }, [role]);

      const Menu = ({ id, label, icon }) => visibleMenus.includes(id) && (
        <div className={"menu-item " + (active===id?"active":"")} onClick={()=>setActive(id)}>
          <span style={{width:14}}>{icon}</span>{label}
        </div>
      );

      return (
        <div className="flex min-h-screen">
          {/* Sidebar */}
          <aside className="w-56 bg-panel border-r border-line flex flex-col">
            <div className="px-5 py-5 border-b border-line">
              <div className="flex items-center gap-2">
                <span className="text-cool text-lg">◆</span>
                <span className="font-semibold tracking-wider" style={{letterSpacing:2}}>体育游戏</span>
              </div>
              <div className="text-xs text-faint mt-1 ml-5">总控后台 V0.2</div>
            </div>
            <nav className="flex-1 px-3 py-3 overflow-y-auto">
              <div className="menu-group">账号管理</div>
              <Menu id="agents" label="顶代户口" icon="◉"/>

              <div className="menu-group">报表管理</div>
              <Menu id="reports.bets" label="注单记录" icon="◐"/>
              <Menu id="reports.sports" label="体育场次记录" icon="◑"/>
              <Menu id="reports.ledger" label="交易流水记录" icon="◒"/>

              <div className="menu-group">系统管理</div>
              <Menu id="sys.audit" label="操作日志" icon="◓"/>
            </nav>
            <div className="px-4 py-3 border-t border-line text-xs text-faint">
              <div>内部工具 · 仅限授权员工</div>
              <div className="mt-1" style={{fontSize:10,color:"#5C6878"}}>原型仅评审用 · 实际开发使用 @ant-design/pro-components</div>
            </div>
          </aside>

          {/* Main */}
          <main className="flex-1 flex flex-col bg-app">
            <header className="border-b border-line px-6 py-3 flex items-center justify-between bg-panel">
              <div className="text-xs text-faint">
                {active === "agents" && "账号管理 / 顶代户口"}
                {active === "reports.bets" && "报表管理 / 注单记录"}
                {active === "reports.sports" && "报表管理 / 体育场次记录"}
                {active === "reports.ledger" && "报表管理 / 交易流水记录"}
                {active === "sys.audit" && "系统管理 / 操作日志"}
              </div>
              <div className="flex items-center gap-3">
                <span className="text-xs text-muted">当前角色</span>
                <select className="input w-32" value={role} onChange={e=>setRole(e.target.value)} style={{padding:"6px 10px"}}>
                  <option value="operator">平台运营</option>
                  <option value="risk">风控审计</option>
                  <option value="finance">财务对账</option>
                </select>
                <span className="chip chip-cool">{r.desc}</span>
                <span className="text-xs text-muted">admin@platform</span>
              </div>
            </header>
            <div className="flex-1 overflow-auto">
              {active === "agents" && <AgentsPage role={role} canWrite={r.canWrite}/>}
              {active === "reports.bets" && <BetsPage role={role}/>}
              {active === "reports.sports" && <SportsSessionsPage role={role}/>}
              {active === "reports.ledger" && <LedgerPage role={role}/>}
              {active === "sys.audit" && <AuditPage role={role}/>}
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
