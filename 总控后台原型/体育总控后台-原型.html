            <p className="text-xs text-faint mb-3">{session.date} · 顶代 <span className="mono">{session.user}</span> · 币种 {session.currency} · 共 {matched.length} 条注单 · <span className="text-faint">PM 简化:按 topAgent 过滤,真实按场次 batchId 关联</span></p>
            <div className="bg-panel border border-line rounded-lg overflow-hidden mb-3">
              <div className="scroll-x">
                <table style={{fontSize:12}}>
                  <thead><tr>
                    <th>注单号</th><th>系统户口号</th><th>用户账号</th><th>币种</th><th>投注时间</th><th>结算时间</th>

                  </tr></thead>
                  <tbody>
                    {pageData.map(b => (
                      <tr key={b.id}>
                        <td className="mono" style={{fontSize:11}}>{b.id}</td>
                        <td className="mono text-muted">{b.playerSysId}</td>
                        <td className="mono">{b.playerUser}</td>
                        <td><span className="chip chip-info">{b.currency}</span></td>
                        <td className="text-muted" style={{fontSize:11}}>{b.betTime}</td>
                        <td className="text-muted" style={{fontSize:11}}>{b.settleTime}</td>
                        <td className="num text-right">{fmtAmount(b.stake)}</td>
                        <td className="num text-right">{fmtAmount(b.payout)}</td>
                        <td className="num text-right" style={{color: b.winLoss > 0 ? "#5BC97C" : (b.winLoss < 0 ? "#FF6B6B" : "#9AA4B5")}}>{(b.winLoss > 0 ? "+" : "") + fmtAmount(b.winLoss)}</td>
                        <td className="num text-right">{fmtAmount(b.validStake !== undefined ? b.validStake : b.stake)}</td>
                      </tr>
                    ))}
                    {pageData.length === 0 && <tr><td colSpan="10" style={{textAlign:"center",padding:"20px",color:"#6B7280"}}>暂无数据</td></tr>}
                  </tbody>
                  {pageData.length > 0 && (
                    <tfoot>
                      <tr style={{background:"#0F141C",borderTop:"1px solid #2A3648"}}>
                        <td colSpan="6" className="text-faint" style={{fontSize:11,padding:"8px"}}>本页小计({pageData.length} 条)</td>
                        <td className="num text-right">{fmtAmount(sub.stake)}</td>
                        <td className="num text-right">{fmtAmount(sub.payout)}</td>
                        <td className="num text-right" style={{color: sub.winLoss > 0 ? "#5BC97C" : (sub.winLoss < 0 ? "#FF6B6B" : "#9AA4B5")}}>{(sub.winLoss > 0 ? "+" : "") + fmtAmount(sub.winLoss)}</td>
                        <td className="num text-right">{fmtAmount(sub.validStake)}</td>
                      </tr>
                      <tr style={{background:"#11161E"}}>
                        <td colSpan="6" className="text-cool font-semibold" style={{fontSize:11,padding:"8px"}}>总计({matched.length} 条)</td>
                        <td className="num text-right text-cool">{fmtAmount(total.stake)}</td>
                        <td className="num text-right text-cool">{fmtAmount(total.payout)}</td>
                        <td className="num text-right" style={{color: total.winLoss > 0 ? "#5BC97C" : (total.winLoss < 0 ? "#FF6B6B" : "#9AA4B5"),fontWeight:600}}>{(total.winLoss > 0 ? "+" : "") + fmtAmount(total.winLoss)}</td>
                        <td className="num text-right text-cool">{fmtAmount(total.validStake)}</td>
                      </tr>
                    </tfoot>
                  )}
                </table>
              </div>
            </div>
            {/* 左下: 导出 Excel  右下: 翻页 */}
            <div className="flex items-center gap-2" style={{justifyContent:"space-between"}}>
              <button className="btn btn-ghost" disabled={matched.length===0} style={{padding:"4px 14px",fontSize:12}} onClick={()=>doExport("游戏明细_"+session.id, matched.length, appendSystemLog)}>导出 Excel</button>

                <span className="text-xs text-faint" style={{marginRight:4}}>每页 {pageSize} 条 · 共 {matched.length} 条</span>

              </div>
            </div>
          </div>
        </div>

    // ============== 工具函数 ==============
    // fmtNum: 纯数字 (下线数 / 注单数 / 玩家数), 千分位
    const fmtNum = (n, dec=0) => {
      if (n === 0) return "0";
      if (typeof n !== "number") return n;
      return n.toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec });
    };
    // fmtAmount: 金额走「万」单位 (B 端 V1.12 line 189-198 同款规则)
    //   全量, 无下限阈值, 最多 4 位小数; 8,000 → 0.8 万 / 300 → 0.03 万 / 0 → 0 万 / -1,200 → -0.12 万
    //   2026-04-29 Sammy 拍: 金额不带币种后缀, 币种走独立列
    const fmtAmount = (n) => {
      if (n === undefined || n === null || isNaN(n)) return "-";
      const v = n / 10000;
      return v.toLocaleString("zh-CN", { maximumFractionDigits: 4 }) + " 万";
    };
    const fmtPct = (n) => (n * 100).toFixed(2) + "%";

    // IP 白名单校验工具 (V0.2 支持 IPv4 单 IP + CIDR /N 段)
    // 真实开发可换成 ip-cidr / netmask 库; mock 用纯 JS 实现
    const ipToInt = (ip) => {
      const parts = ip.split(".");
      if (parts.length !== 4) return null;
      let n = 0;
      for (const p of parts) {
        const v = parseInt(p, 10);
        if (!Number.isFinite(v) || v < 0 || v > 255) return null;
        n = (n * 256) + v;
      }
      return n;
    };
    const isValidIPv4 = (ip) => ipToInt(ip) !== null;
    const isValidCIDR = (cidr) => {
      const m = cidr.match(/^(\d{1,3}(?:\.\d{1,3}){3})\/(\d{1,2})$/);
      if (!m) return false;
      if (!isValidIPv4(m[1])) return false;
      const n = parseInt(m[2], 10);
      return n >= 0 && n <= 32;
    };
    const isValidIPOrCIDR = (s) => isValidIPv4(s) || isValidCIDR(s);
    // 检查 ip 是否命中 entry (单 IP 完全匹配 OR CIDR 段包含)
    const ipMatches = (ip, entry) => {
      if (!entry.includes("/")) return ip === entry;
      const m = entry.match(/^(\d{1,3}(?:\.\d{1,3}){3})\/(\d{1,2})$/);
      if (!m) return false;
      const baseInt = ipToInt(m[1]);
      const ipInt = ipToInt(ip);
      if (baseInt === null || ipInt === null) return false;
      const prefix = parseInt(m[2], 10);
      if (prefix === 0) return true;
      const mask = (~((1 << (32 - prefix)) - 1)) >>> 0;
      return (baseInt & mask) === (ipInt & mask);
    };
    // 白名单准入校验: 启用条目为空 = 不限制 (放行); 否则 ip 必须命中至少 1 条启用项
    const checkIPAllowed = (ip, whitelist) => {
      const enabled = whitelist.filter(w => w.enabled);
      if (enabled.length === 0) return true; // 无启用项 = 不限制
      return enabled.some(w => ipMatches(ip, w.ip));
    };

    // 导出 Excel 工具 (V0.2 仅原型 alert, 真实开发用 xlsx 库)
    // 命名规则 (Sammy 2026-04-30 拍): YYYY-MM-DD_菜单名.xlsx, 全量导出 (不按筛选)
    const doExport = (menuName, totalCount, appendSystemLog) => {
      const now = new Date();
      const pad = (n) => String(n).padStart(2,"0");
      const dateStr = now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate());
      const filename = dateStr+"_"+menuName+".xlsx";
      alert("导出 Excel\n\n文件名: "+filename+"\n范围: 全量数据 (不按当前筛选)\n总条数: "+totalCount+" 条\n\n[V0.2 原型 placeholder, 真实开发对接后端导出接口]");
      appendSystemLog && appendSystemLog("导出 Excel", menuName+" / 全量 "+totalCount+" 条 → "+filename);
    };

    // ============== 通用分页组件 (列表页统一 20 条/页) ==============
    const PAGE_SIZE = 20;
    function Pagination({ total, pageNum, setPageNum, pageSize = PAGE_SIZE }) {
      const totalPages = Math.max(1, Math.ceil(total / pageSize));
      const safePage = Math.min(Math.max(0, pageNum), totalPages - 1);
      const [jumpVal, setJumpVal] = useState("");
      const doJump = () => {
        const n = parseInt(jumpVal, 10);
        if (Number.isFinite(n) && n >= 1 && n <= totalPages) { setPageNum(n - 1); setJumpVal(""); }
      };
      return (
        <div className="flex items-center gap-2" style={{justifyContent:"flex-end", padding:"10px 12px", borderTop:"1px solid #2A3648", background:"#0F141C"}}>
          <span className="text-xs text-faint" style={{marginRight:6}}>共 {total} 条 · 每页 {pageSize} 条</span>
          <button className="btn btn-ghost" onClick={()=>setPageNum(p=>Math.max(0,p-1))} disabled={safePage===0} style={{padding:"4px 12px",fontSize:12}}>← 上一页</button>
          <span className="text-xs text-muted">第 {safePage+1} / {totalPages} 页</span>
          <button className="btn btn-ghost" onClick={()=>setPageNum(p=>Math.min(totalPages-1,p+1))} disabled={safePage>=totalPages-1} style={{padding:"4px 12px",fontSize:12}}>下一页 →</button>
          <span className="text-xs text-faint" style={{marginLeft:8}}>跳至</span>
          <input className="input" type="number" min="1" max={totalPages} value={jumpVal} onChange={e=>setJumpVal(e.target.value)} onKeyDown={e=>{if(e.key==="Enter") doJump();}} style={{width:60,padding:"4px 8px",fontSize:12,textAlign:"center"}} placeholder={String(safePage+1)}/>
          <span className="text-xs text-faint">页</span>
          <button className="btn btn-ghost" onClick={doJump} disabled={!jumpVal} style={{padding:"4px 10px",fontSize:12}}>确定</button>
        </div>
      );
    }

    const StatusChip = ({ status }) => {
      const map = { active:"chip-active", frozen:"chip-frozen", settled:"chip-settled", void:"chip-void", "未结算":"chip-warn", "已结算":"chip-settled" };
      // V0.2 状态文案统一 (Sammy 2026-04-30 拍): 账号 frozen → "禁用" (跟修改资料弹窗 radio 对齐)
      const txt = { active:"启用", frozen:"禁用", settled:"已结算", void:"作废" };

    // ============== 操作密码 + 审计原因 弹窗 (V0.1 沿用) ==============
    function PasswordModal({ title, fields, onConfirm, onClose, wide }) {
      const [pwd, setPwd] = useState("");

              <div>
                <label className="block text-xs text-muted mb-1">操作密码 <span style={{color:"#FF6B6B"}}>*</span></label>
                <input type="password" className="input" placeholder="当前登录员工的登录密码 (Mock: 123456)" value={pwd} onChange={e=>setPwd(e.target.value)}/>

    }

    // ============== 顶代户口页 ==============
    function AgentsPage({ role, canWrite, appendSystemLog, accounts, setAccounts, topKeys, setTopKeys }) {
      const [modal, setModal] = useState(null);
      const [expanded, setExpanded] = useState(new Set());
      // accounts / topKeys 由 App 层 lift (V0.2 修 bug, Sammy 2026-04-30): 切菜单不丢 state
      const cols = ROLES[role].agentCols;
      // 修改资料: 把 form 字段 merge 到节点上 (mock 内存中改, 不持久化)
      // 级联冻结 (Sammy 2026-04-30 拍): status 改成 frozen 时递归把所有 children 也置 frozen, 跟 B 端 V1.12 setStatus 'off' 级联对齐
      // 解冻不级联: status 从 frozen → active 时只改自己, 子代保持原状 (避免误操作让独立冻结的下线被误激活)
      const handleEditProfile = (account, data) => {
        const next = {...accounts};
        const k = account.key;
        if (!next[k]) return;
        const wasFrozen = next[k].status === "frozen";
        // 重置密码: V0.2 mock 仅 alert 演示, 真实开发对接后端写库 + 强制 next-login-must-change
        if (data.resetPwd) {
          alert("已重置 " + account.user + " 的登录密码 (mock 不真改);该下线下次登录将强制修改密码");
          appendSystemLog && appendSystemLog("重置下线密码", account.user+" ("+account.sysId+") 强制下次登录改密");
        }
        // 操作日志: 记录关键 diff (status / nick / shareRatio / refRate)
        // status 翻译成中文跟 StatusChip 文案对齐 (Sammy 2026-04-30 二扫)
        const statusTxt = { active:"启用", frozen:"禁用" };
        const diffs = [];
        if (data.status !== next[k].status) diffs.push("状态: "+(statusTxt[next[k].status]||next[k].status)+" → "+(statusTxt[data.status]||data.status));
        if (data.nick !== next[k].nick) diffs.push("昵称: "+(next[k].nick||"-")+" → "+data.nick);
        if (data.shareRatio != null && data.shareRatio !== next[k].shareRatio) diffs.push("占成: "+(next[k].shareRatio==null?"-":(next[k].shareRatio*100).toFixed(2)+"%")+" → "+(data.shareRatio*100).toFixed(2)+"%");
        if (data.refRate != null && data.refRate !== next[k].refRate) diffs.push("佣金率: "+(next[k].refRate==null?"-":(next[k].refRate*100).toFixed(2)+"%")+" → "+(data.refRate*100).toFixed(2)+"%");
        if (diffs.length) appendSystemLog && appendSystemLog("修改资料", account.user+" ("+account.sysId+") "+diffs.join(" / "));
        next[k] = { ...next[k], nick: data.nick, phone: data.phone, phone2: data.phone2, accountType: data.accountType || next[k].accountType, shareRatio: data.shareRatio == null ? next[k].shareRatio : data.shareRatio, refRate: data.refRate == null ? next[k].refRate : data.refRate, status: data.status };
        // 级联冻结子树
        if (data.status === "frozen" && !wasFrozen) {
          const cascade = (key) => {
            const node = next[key]; if (!node) return;
            (node.children || []).forEach(c => {
              if (next[c]) {
                next[c] = { ...next[c], status: "frozen" };
                cascade(c);
              }
            });
          };
          cascade(k);
        }
        setAccounts(next);
        setModal(null);
      };
      // 上下分: 资金在树内部转移 (该账号 ↔ 直属上级), 整棵树总余额不变; amount 单位"万"
      // 上分 +X: 该账号 balance +X, 上级 balance -X (上级出钱), 上级 subBalance +X (子树涨), 上级 totalBalance 不变
      // 下分 -X: 该账号 balance -X, 上级 balance +X (上级收钱), 上级 subBalance -X, 上级 totalBalance 不变
      const handleCreditDebit = (account, dir, amountWan) => {
        const realAmount = amountWan * 10000;
        const next = {...accounts};
        const k = account.key;
        if (!next[k]) return;
        // 找直属上级
        let parentKey = null;
        for (const [pk, pn] of Object.entries(next)) {
          if (pk !== k && pn.children && pn.children.includes(k)) { parentKey = pk; break; }
        }
        if (!parentKey) { alert("⚠ 找不到直属上级\n无法执行上下分,请联系技术支持"); return; }
        if (dir === "credit") {
          if ((next[parentKey].balance || 0) < realAmount) { alert("⚠ 上级账户余额不足\n上级 "+next[parentKey].user+" 当前余额 "+fmtAmount(next[parentKey].balance)+" "+next[parentKey].currency+",无法上分 "+fmtAmount(realAmount)+"。\n建议先让账房给上级补充余额"); return; }
          next[k] = { ...next[k], balance: next[k].balance + realAmount, totalBalance: next[k].totalBalance + realAmount };
          next[parentKey] = { ...next[parentKey], balance: next[parentKey].balance - realAmount, subBalance: next[parentKey].subBalance + realAmount };
          // totalBalance 不变 (balance -X, subBalance +X 抵消)
          appendSystemLog && appendSystemLog("上分", "下线 "+account.user+" ("+account.sysId+") +"+fmtAmount(realAmount)+" "+account.currency);
        } else { // debit
          if ((next[k].balance || 0) < realAmount) { alert("⚠ 账户余额不足\n下线 "+account.user+" 当前余额 "+fmtAmount(next[k].balance)+" "+account.currency+",无法下分 "+fmtAmount(realAmount)); return; }
          next[k] = { ...next[k], balance: next[k].balance - realAmount, totalBalance: next[k].totalBalance - realAmount };
          next[parentKey] = { ...next[parentKey], balance: next[parentKey].balance + realAmount, subBalance: next[parentKey].subBalance - realAmount };
          appendSystemLog && appendSystemLog("下分", "下线 "+account.user+" ("+account.sysId+") -"+fmtAmount(realAmount)+" "+account.currency);
        }
        setAccounts(next);
        setModal(null);
      };
      // 新增下线: 派生 sysId / 加节点 / 更新父级 children / 沿祖先链 +subCount
      const handleNewSub = (parent, data) => {
        const next = {...accounts};
        const parentKey = parent.key;
        const parentNode = next[parentKey];
        if (!parentNode) return;
        const childSeq = (parentNode.children || []).length + 1;
        const newSysId = parentNode.sysId + "-" + childSeq;
        const newKey = data.user + "::" + data.currency;
        if (next[newKey]) { alert("⚠ 用户账号已存在\n该用户名在 "+data.currency+" 币种线下已被占用,请换一个用户账号"); return; }
        const now = new Date();
        const pad = (n) => String(n).padStart(2, "0");
        const createdAt = now.getFullYear() + "-" + pad(now.getMonth()+1) + "-" + pad(now.getDate()) + " " + pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
        next[newKey] = {
          sysId: newSysId, user: data.user, nick: data.nick, accountType: data.type, currency: data.currency,
          shareRatio: data.shareRatio, refRate: data.refRate, balance: 0, subBalance: 0, totalBalance: 0,
          subCount: 0, status: data.status, createdAt, children: [],
        };
        next[parentKey] = { ...parentNode, children: [...(parentNode.children || []), newKey], subCount: (parentNode.subCount || 0) + 1 };
        // 沿祖先链 +1 subCount (穿透口径)
        let cursor = parentKey;
        while (true) {
          let found = null;
          for (const [k, n] of Object.entries(next)) {
            if (k !== cursor && n.children && n.children.includes(cursor)) { found = k; break; }
          }
          if (!found) break;
          next[found] = { ...next[found], subCount: (next[found].subCount || 0) + 1 };
          cursor = found;
        }
        setAccounts(next);
        // 自动展开父级让用户看到新行
        const ne = new Set(expanded); ne.add(parentKey); setExpanded(ne);
        setModal(null);
        appendSystemLog && appendSystemLog("新增下级", "顶代 "+parentNode.user+" ("+parentNode.currency+") 下新增"+data.type+" "+data.user+" ("+newSysId+")");
      };
      // 所有筛选走"输入态 + 提交后生效"双状态 (跟搜索按钮一起触发, ProComponents QueryFilter 模式)
      // V0.2 (Sammy 2026-04-30): 系统户口号 / 用户账号 拆 2 个独立筛选框
      const [inSysIdQ, setInSysIdQ] = useState(""), [sysIdQ, setSysIdQ] = useState("");
      const [inUserQ, setInUserQ] = useState(""), [userQ, setUserQ] = useState("");
      const [inStatus, setInStatus] = useState("all"), [statusFilter, setStatusFilter] = useState("all");
      const [inCurrency, setInCurrency] = useState("PHP"), [currencyFilter, setCurrencyFilter] = useState("PHP");  // V0.2 (Sammy 2026-04-30): 默认 PHP
      const [inShareRatio, setInShareRatio] = useState("all"), [shareRatioFilter, setShareRatioFilter] = useState("all");
      const [inDateFrom, setInDateFrom] = useState(""), [dateFrom, setDateFrom] = useState("");
      const [inDateTo, setInDateTo] = useState(""), [dateTo, setDateTo] = useState("");
      const [pageNum, setPageNum] = useState(0);
      const doSearch = () => {
        setSysIdQ(inSysIdQ.trim()); setUserQ(inUserQ.trim()); setStatusFilter(inStatus); setCurrencyFilter(inCurrency);
        setShareRatioFilter(inShareRatio); setDateFrom(inDateFrom); setDateTo(inDateTo); setPageNum(0);
      };
      const resetSearch = () => {
        // V0.2 重置时币种默认 PHP (Sammy 2026-04-30)
        setInSysIdQ(""); setInUserQ(""); setInStatus("all"); setInCurrency("PHP"); setInShareRatio("all"); setInDateFrom(""); setInDateTo("");
        setSysIdQ(""); setUserQ(""); setStatusFilter("all"); setCurrencyFilter("PHP"); setShareRatioFilter("all"); setDateFrom(""); setDateTo(""); setPageNum(0);
      };

      // Tree 扁平化: 顶代行先过筛选; 下线行只在父级展开时才出现 (V0.1 同款懒加载)
      // 搜索逻辑: 树状穿透 - 任何后代匹配, 整条祖先链都显示并自动展开 (大小写不敏感)
      // V0.2 (Sammy 2026-04-30): sysId / user 拆 2 个独立条件 (AND 关系)
      const rows = useMemo(() => {
        const out = [];
        const sysQ = (sysIdQ || "").toLowerCase().trim();
        const userQ_ = (userQ || "").toLowerCase().trim();
        const hasQ = sysQ || userQ_;
        const matches = (node) => {
          if (sysQ && !node.sysId.toLowerCase().includes(sysQ)) return false;
          if (userQ_ && !node.user.toLowerCase().includes(userQ_)) return false;
          return true;
        };

        // V0.2 (Sammy 2026-04-30): 搜索时不显示祖先链, 平铺命中节点(任意层级)作为 depth=0 显示, 可展开看下级
        // 默认模式 (无搜索): 顶代行按 createdAt DESC + Tree Table 展开下线
        if (hasQ) {
          // 搜索模式: 平铺命中
          const matchedKeys = Object.keys(accounts).filter(k => matches(accounts[k]));
          // 命中节点也按 createdAt DESC 排
          matchedKeys.sort((a,b) => (accounts[b].createdAt || "").localeCompare(accounts[a].createdAt || ""));
          function walkSearch(key, depth) {
            const node = accounts[key]; if (!node) return;
            out.push({ ...node, key, depth });
            // 搜索模式下展开仍受 expanded 控制 (用户主动展开看下级)
            if (expanded.has(key)) {
              (node.children || []).forEach(c => walkSearch(c, depth + 1));
            }
          }
          matchedKeys.forEach(k => walkSearch(k, 0));
          return out;
        }

        // 默认模式: 顶代行 + 展开下线 + 顶代行筛选
        // V0.2 (Sammy 2026-04-30): 顶代行按 createdAt DESC 排序 (最新开户在前)
        const sortedTopKeys = [...topKeys].sort((a,b) => (accounts[b]?.createdAt || "").localeCompare(accounts[a]?.createdAt || ""));
        function walk(key, depth) {
          const node = accounts[key];
          if (!node) return;
          if (depth === 0) {
            if (statusFilter !== "all" && node.status !== statusFilter) return;
            if (currencyFilter !== "all" && node.currency !== currencyFilter) return;
            if (shareRatioFilter !== "all") {
              const r = node.shareRatio;
              if (r == null) return;
              if (shareRatioFilter === "lt10" && r >= 0.10) return;
              if (shareRatioFilter === "10to20" && (r < 0.10 || r >= 0.20)) return;
              if (shareRatioFilter === "20to30" && (r < 0.20 || r >= 0.30)) return;
              if (shareRatioFilter === "gte30" && r < 0.30) return;
            }
            // datetime-local step=1 时返回 YYYY-MM-DDTHH:mm:ss (19 字符), 否则 YYYY-MM-DDTHH:mm (16 字符)
            // createdAt 是 "YYYY-MM-DD HH:mm:ss", 比较前 normalize: replace T + 必要时补秒
            if (dateFrom) {
              let fromCmp = dateFrom.replace("T", " ");
              if (fromCmp.length === 16) fromCmp += ":00";
              if (node.createdAt < fromCmp) return;
            }
            if (dateTo) {
              let toCmp = dateTo.replace("T", " ");
              if (toCmp.length === 16) toCmp += ":59";
              if (node.createdAt > toCmp) return;
            }
          }
          out.push({ ...node, key, depth });
          if (expanded.has(key)) {
            (node.children || []).forEach(child => walk(child, depth + 1));
          }
        }
        sortedTopKeys.forEach(k => walk(k, 0));
        return out;
      }, [accounts, topKeys, sysIdQ, userQ, statusFilter, currencyFilter, shareRatioFilter, dateFrom, dateTo, expanded]);

      // 按顶代行分组 (顶代 + 该顶代展开的所有下线 = 1 组), 分页以"组"为单位 (PAGE_SIZE 个顶代/页, 展开下线随父级一起出现)
      const groups = useMemo(() => {
        const out = []; let cur = null;
        for (const r of rows) {
          if (r.depth === 0) { cur = { top: r, descs: [] }; out.push(cur); }
          else if (cur) cur.descs.push(r);
        }
        return out;
      }, [rows]);
      const totalTop = groups.length;
      const pagedRows = groups.slice(pageNum*PAGE_SIZE, (pageNum+1)*PAGE_SIZE).flatMap(g => [g.top, ...g.descs]);

      const toggle = (key) => {
        const next = new Set(expanded);
        if (next.has(key)) next.delete(key); else next.add(key);
        setExpanded(next);
      };

      // 字段集 (Sammy 2026-04-29 拍 13 列, 砍昵称/佣金率上限/本月投注/本月佣金/最近登录入详情)
      // 占成对下线层占位显 — (Sammy 2026-04-29 「下线层暂未支持占成」)
      const colDefs = [
        { id:1, label:"系统户口号", render:a => (
          <span className="inline-flex items-center" style={{paddingLeft: a.depth * 16}}>
            {(a.children && a.children.length > 0) ? (
              <span className="cursor-pointer text-cool" onClick={()=>toggle(a.key)} style={{marginRight:6,userSelect:"none",width:14,display:"inline-block"}}>
                {expanded.has(a.key) ? "▾" : "▸"}
              </span>
            ) : <span style={{display:"inline-block",width:20}}></span>}
            <span className="mono text-muted">{a.sysId}</span>
          </span>
        ) },
        { id:2, label:"用户账号", render:a => <span className="mono">{a.user}</span> },  // V0.2 (Sammy 2026-04-30): 列表蓝改色 - 顶代行 user 不用 text-cool, 跟下线行一致
        { id:3, label:"下线数", render:a => <span className="num">{a.subCount}</span> },
        { id:4, label:"账号状态", render:a => <StatusChip status={a.status}/> },
        { id:5, label:"币种", render:a => <span className="chip chip-info">{a.currency}</span> },  // V0.2 (Sammy 2026-04-30): 蓝改灰
        { id:6, label:"占成", render:a => {
          if (a.shareRatio == null) return <span className="text-faint">—</span>;
          if (a.depth === 0) return <span className="num">{fmtPct(a.shareRatio)}</span>;
          // 下线层每行有自己的参考占成 (mock 演示: 上级让利后传递, 真实字段后端尚未支持独立调整 - Q-S11)
          return <span className="num text-faint" title="参考占成 (下线尚未支持独立调整, V0.2 mock 演示)">{fmtPct(a.shareRatio)} <span style={{fontSize:9,marginLeft:2}}>(参考)</span></span>;
        }},
        { id:7, label:"账户余额", render:a => <span className="num">{fmtAmount(a.balance)}</span> },
        { id:8, label:"下线余额", render:a => <span className="num text-muted">{fmtAmount(a.subBalance)}</span> },
        { id:9, label:"总线余额", render:a => <span className="num" style={{fontWeight:600}}>{fmtAmount(a.totalBalance)}</span> },  // V0.2 (Sammy 2026-04-30): 蓝改默认主文字 + 加粗保留视觉强调
        { id:10, label:"账号类型", render:a => {
          // V0.2 (Sammy 2026-04-30): 顶代蓝改紫 (#9B7FE8 中性强调色), 代理保留黄, 游戏保留灰
          if (a.accountType === "普通(顶代)") return <span className="chip" style={{background:"#2A1F3D",color:"#9B7FE8"}}>{a.accountType}</span>;
          if (a.accountType === "代理")     return <span className="chip chip-warn">{a.accountType}</span>;
          return <span className="chip chip-info">{a.accountType}</span>;
        } },
        { id:11, label:"开户时间", render:a => <span className="text-muted" style={{fontSize:12}}>{a.createdAt}</span> },
      ].filter(c => cols.includes(c.id));

      return (
        <div className="p-6">
          <div className="flex items-center justify-between mb-5">
            <div>
              <h2 className="text-xl font-semibold">顶代户口</h2>
              <p className="text-xs text-muted mt-1">账号管理 · 平台直辖顶代  ·  1 顶代多币种 = N 行(按币种拆)  ·  {ROLES[role].name} 视角可见 {cols.length} 列</p>
            </div>
          </div>
          <div className="bg-cool-soft border border-cool rounded-lg p-3 mb-4 text-xs flex items-start gap-2">
            <span className="text-cool">ℹ</span>
            <span><b>账号来源:</b>顶代账号由<b>账房侧</b>创建并下发户口(系统户口号 + 初始币种 + 初始占成),本页仅查看与管理(冻结 / 调占成 / 调币种),<b>不负责创建</b>。下线数 / 下线余额 / 总线余额 主信源在 B 端代理后台。Q-S7 / Q-S14 议题待。</span>
          </div>
          <div className="bg-panel border border-line rounded-lg p-3 mb-4">
            <div className="flex flex-wrap gap-2 items-center">
              <input className="input" style={{width:200}} placeholder="搜索系统户口号" value={inSysIdQ} onChange={e=>setInSysIdQ(e.target.value)} onKeyDown={e=>{if(e.key==="Enter") doSearch();}}/>
              <input className="input" style={{width:200}} placeholder="搜索用户账号" value={inUserQ} onChange={e=>setInUserQ(e.target.value)} onKeyDown={e=>{if(e.key==="Enter") doSearch();}}/>
              <select className="input" style={{width:130}} value={inStatus} onChange={e=>setInStatus(e.target.value)}>
                <option value="all">全部状态</option>
                <option value="active">启用</option>
                <option value="frozen">禁用</option>
              </select>
              <select className="input" style={{width:120}} value={inCurrency} onChange={e=>setInCurrency(e.target.value)}>
                <option value="all">全部币种</option>
                <option value="KRW">KRW</option><option value="USD">USD</option><option value="PHP">PHP</option><option value="CNY">CNY</option><option value="THB">THB</option>
              </select>
              {/* V0.2 隐藏占成筛选 (Sammy 2026-04-30): 后期重启把这块加回 */}
              <ConfigProvider locale={zhCN}>
                <RangePicker
                  showTime={{ format: "HH:mm:ss" }}
                  format="YYYY-MM-DD HH:mm:ss"
                  placeholder={["开户开始时间","结束时间"]}
                  allowEmpty={[true, true]}
                  value={[inDateFrom ? moment(inDateFrom.replace("T"," ")) : null, inDateTo ? moment(inDateTo.replace("T"," ")) : null]}
                  onChange={(vals) => {
                    if (!vals) { setInDateFrom(""); setInDateTo(""); return; }
                    setInDateFrom(vals[0] ? vals[0].format("YYYY-MM-DDTHH:mm:ss") : "");
                    setInDateTo(vals[1] ? vals[1].format("YYYY-MM-DDTHH:mm:ss") : "");
                  }}
                  style={{ height: 36, width: 380 }}
                />
              </ConfigProvider>
              <button className="btn btn-primary" style={{padding:"8px 18px"}} onClick={doSearch}>搜索</button>
              <button className="btn btn-ghost" style={{padding:"8px 14px"}} onClick={resetSearch}>重置</button>
            </div>
            <div className="flex items-center mt-2 text-xs text-faint">
              <span>共 {totalTop} 顶代行  ·  当前页渲染 {pagedRows.length} 行(含展开下线)</span>
              <button className="btn btn-ghost ml-auto" style={{padding:"4px 10px",fontSize:11}} onClick={()=>setExpanded(new Set())} disabled={expanded.size===0}>全部收起</button>
            </div>
          </div>
          <div className="bg-panel border border-line rounded-lg overflow-hidden">
            <div className="scroll-x">
              <table>
                <thead>
                  <tr>
                    {colDefs.map(c => <th key={c.id}>{c.label}</th>)}
                    {canWrite && <th>操作</th>}
                  </tr>
                </thead>
                <tbody>
                  {pagedRows.map(a => {
                    const isTop = a.accountType === "普通(顶代)";
                    const isAgent = a.accountType === "代理";
                    const isPlayer = a.accountType === "游戏";
                    return (
                    <tr key={a.key} style={a.depth > 0 ? {background:"rgba(74,158,255,0.04)"} : {}}>
                      {colDefs.map(c => <td key={c.id}>{c.render(a)}</td>)}
                      {canWrite && <td>
                        <div style={{display:"flex",gap:"4px"}}>
                          {(isTop || isAgent) ? <button className="btn btn-ghost" style={{padding:"4px 0",fontSize:11,width:70,textAlign:"center"}} onClick={()=>setModal({type:"newSub",agent:a})}>新增下级</button> : <div style={{width:70}}/>}
                          <button className="btn btn-ghost" style={{padding:"4px 0",fontSize:11,width:70,textAlign:"center"}} onClick={()=>setModal({type:"editProfile",agent:a})}>修改资料</button>
                          {(isAgent || isPlayer) ? <button className="btn btn-ghost" style={{padding:"4px 0",fontSize:11,width:54,textAlign:"center",color:"#5BC97C",borderColor:"#2A4534"}} onClick={()=>setModal({type:"credit",agent:a})}>上分</button> : <div style={{width:54}}/>}
                          {(isAgent || isPlayer) ? <button className="btn btn-ghost" style={{padding:"4px 0",fontSize:11,width:54,textAlign:"center",color:"#FF8B6B",borderColor:"#5A2D33"}} onClick={()=>setModal({type:"debit",agent:a})}>下分</button> : <div style={{width:54}}/>}
                        </div>
                      </td>}
                    </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
            <Pagination total={totalTop} pageNum={pageNum} setPageNum={setPageNum}/>
          </div>
          {modal && modal.type === "newSub" && <NewSubModal parent={modal.agent} accounts={accounts} onClose={()=>setModal(null)} onSubmit={(data)=>handleNewSub(modal.agent, data)}/>}
          {modal && modal.type === "editProfile" && <EditProfileModal account={modal.agent} accounts={accounts} onClose={()=>setModal(null)} onSubmit={(data)=>handleEditProfile(modal.agent, data)}/>}
          {modal && (modal.type === "credit" || modal.type === "debit") && <CreditDebitModal dir={modal.type} account={modal.agent} accounts={accounts} onClose={()=>setModal(null)} onSubmit={(amountWan)=>handleCreditDebit(modal.agent, modal.type, amountWan)}/>}
        </div>
      );
    }

    // 新增下线弹窗 (独立组件 / 内部 state / 提交时回传完整数据)
    // 注意: S 端列表是 1 顶代多币种 = N 行, 每行已经是具体币种行
    //       从哪行点「新增下级」就在哪个币种线下创建, 不再让用户选币种 / 方案
    //       业务硬规则: 单个币种发展下线整条线币种一致 (Sammy 2026-04-29 拍)
    function NewSubModal({ parent, accounts, onClose, onSubmit }) {
      const [user, setUser] = useState("");
      const [nick, setNick] = useState("");
      const [pwd, setPwd] = useState("");
      const [pwdC, setPwdC] = useState("");
      const [phone, setPhone] = useState("");
      const [phone2, setPhone2] = useState("");
      const [accType, setAccType] = useState("代理");
      const [accStatus, setAccStatus] = useState("active");
      const [refShareRatio, setRefShareRatio] = useState(""); // 参考占成
      const [refRate, setRefRate] = useState(""); // 参考佣金率
      const [opPwd, setOpPwd] = useState("");
      const [err, setErr] = useState("");

      // 参考占成上限 = 父级 shareRatio (无论父级是顶代还是代理, 同一币种线整条继承)
      const shareUpper = parent.shareRatio || 0;
      const shareUpperPct = (shareUpper * 100).toFixed(2);

      const submit = () => {
        if (!/^[A-Za-z0-9]{6,20}$/.test(user)) { setErr("用户账号需 6-20 位英文+数字"); return; }
        if (!pwd) { setErr("请输入登录密码"); return; }
        if (pwd !== pwdC) { setErr("两次密码不一致"); return; }
        // V0.2 隐藏参考占成 (Sammy 2026-04-30): 提交时不再校验, 后端用父级占成兜底 (后期重启把这两行加回)
        if (refRate === "" || isNaN(+refRate)) { setErr("请输入参考佣金率"); return; }
        if (opPwd !== "123456") { setErr("操作密码错误"); return; }
        onSubmit({
          user, nick: nick.trim() || user, type: accType, status: accStatus,
          currency: parent.currency, // 直接继承父级币种, 不让用户选
          shareRatio: parent.shareRatio || null, // V0.2 隐藏参考占成: 直接继承父级占成
          refRate: +refRate / 100,
        });
      };

      return (
        <div className="modal-backdrop">
          <div className="modal modal-wide" onClick={e=>e.stopPropagation()}>
            <h3 className="text-base font-semibold mb-1">新增下线:{parent.user} 下挂</h3>
            <p className="text-xs text-faint mb-4">沿用 B 端 V1.12 AddSubModal 字段集 · 操作密码二次确认</p>
            <div className="space-y-3">
              <div className="section-title">① 关联信息</div>
              <div className="bg-card border border-line rounded p-3 text-xs">
                <div>上级:<span className="mono text-cool">{parent.user}</span> ({parent.accountType}) · 系统户口号 <span className="mono">{parent.sysId}</span></div>
                <div className="mt-1">系统户口号(自动派生):<span className="mono text-cool">{parent.sysId}-{(parent.children||[]).length+1}</span></div>
                <div className="mt-1 text-faint" style={{fontSize:11}}>系统户口号永不回收、永不复用、永不变更</div>
              </div>

              <div className="section-title">② 基本信息</div>
              <div className="grid grid-cols-2 gap-3">
                <div><label className="block text-xs text-muted mb-1">用户账号 <span style={{color:"#FF6B6B"}}>*</span></label><input className="input" placeholder="6-20 位英数" value={user} onChange={e=>setUser(e.target.value)}/></div>
                <div><label className="block text-xs text-muted mb-1">账户昵称</label><input className="input" placeholder="选填" value={nick} onChange={e=>setNick(e.target.value)}/></div>
                <div><label className="block text-xs text-muted mb-1">密码 <span style={{color:"#FF6B6B"}}>*</span></label><input type="password" className="input" value={pwd} onChange={e=>setPwd(e.target.value)}/></div>
                <div><label className="block text-xs text-muted mb-1">确认密码 <span style={{color:"#FF6B6B"}}>*</span></label><input type="password" className="input" value={pwdC} onChange={e=>setPwdC(e.target.value)}/></div>
                <div><label className="block text-xs text-muted mb-1">电话号码</label><input className="input" placeholder="选填" value={phone} onChange={e=>setPhone(e.target.value)}/></div>
                <div><label className="block text-xs text-muted mb-1">备用电话</label><input className="input" placeholder="选填" value={phone2} onChange={e=>setPhone2(e.target.value)}/></div>
              </div>

              <div className="section-title">③ 账号属性</div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs text-muted mb-1">账号类型 <span style={{color:"#FF6B6B"}}>*</span></label>
                  <div className="flex gap-4 text-sm" style={{paddingTop:6}}>
                    <label><input type="radio" checked={accType==="代理"} onChange={()=>setAccType("代理")}/> <span className="ml-1">代理</span></label>
                    <label><input type="radio" checked={accType==="游戏"} onChange={()=>setAccType("游戏")}/> <span className="ml-1">游戏(玩家)</span></label>
                  </div>
                </div>
                <div>
                  <label className="block text-xs text-muted mb-1">账号状态 <span style={{color:"#FF6B6B"}}>*</span></label>
                  <div className="flex gap-4 text-sm" style={{paddingTop:6}}>
                    <label><input type="radio" checked={accStatus==="active"} onChange={()=>setAccStatus("active")}/> <span className="ml-1">启用</span></label>
                    <label><input type="radio" checked={accStatus==="frozen"} onChange={()=>setAccStatus("frozen")}/> <span className="ml-1">禁用</span></label>
                  </div>
                </div>
              </div>

              <div className="section-title">④ 交收方案(继承上级,不可改)</div>
              <div className="bg-card border border-line rounded p-3 text-xs">
                <div>下线账号<b>整条线</b>继承上级币种 + 方案,不可更换</div>
                <div className="text-muted mt-1">币种:<span className="chip chip-cool">{parent.currency}</span></div>
                <div className="text-faint mt-1" style={{fontSize:11}}>如需另外币种,请回到顶代户口列表,在该顶代的其他币种行点新增下级</div>
              </div>

              <div className="section-title">⑤ 游戏条件</div>
              {/* V0.2 隐藏「参考占成」(Sammy 2026-04-30): 直接继承父级 shareRatio,后期重启把 grid-cols-1 改回 grid-cols-2 + 参考占成 input 加回 */}
              <div>
                <label className="block text-xs text-muted mb-1">参考佣金率 <span style={{color:"#FF6B6B"}}>*</span></label>
                <div className="flex items-center gap-2" style={{maxWidth:280}}>
                  <input type="number" step="0.01" className="input flex-1" value={refRate} onChange={e=>setRefRate(e.target.value)} placeholder="例: 0.30"/>
                  <span className="text-muted">%</span>
                </div>
                <div className="text-faint mt-1" style={{fontSize:11}}>上级给该下线的提成比例(对齐 B 端 rate)</div>
              </div>

              <div className="section-title">⑥ 安全校验</div>
              <div>
                <label className="block text-xs text-muted mb-1">操作密码 <span style={{color:"#FF6B6B"}}>*</span></label>
                <input type="password" className="input" placeholder="当前登录员工的登录密码 (Mock: 123456)" value={opPwd} onChange={e=>setOpPwd(e.target.value)}/>
              </div>
              {err && <div className="text-xs" style={{color:"#FF6B6B"}}>{err}</div>}
            </div>
            <div className="flex justify-end gap-2 mt-5">
              <button className="btn btn-ghost" onClick={onClose}>取消</button>
              <button className="btn btn-primary" onClick={submit}>确认提交</button>
            </div>
          </div>
        </div>
      );
    }

    // 修改资料弹窗 (独立组件, 对齐 B 端 V1.12 EditProfileModal / FN-ACC-05)
    // 3 段:只读信息 / 低敏感字段(无需密码) / 高敏感字段(动态触发操作密码)
    function EditProfileModal({ account, accounts, onClose, onSubmit }) {
      const isTop = account.accountType === "普通(顶代)";
      // 反向找直属父级 (非顶代用)
      const parentNode = isTop ? null : Object.values(accounts).find(n => n.children && n.children.includes(account.key));
      const rateUpper = isTop ? null : (parentNode ? parentNode.shareRatio : 0);
      const rateUpperPct = rateUpper == null ? null : (rateUpper * 100).toFixed(2);

      const initShareRatio = account.shareRatio == null ? "" : (account.shareRatio * 100).toFixed(2);
      const initRefRate = account.refRate == null ? "" : (account.refRate * 100).toFixed(2);
      const [nick, setNick] = useState(account.nick || account.user);
      const [phone, setPhone] = useState(account.phone || "");
      const [phone2, setPhone2] = useState(account.phone2 || "");
      const [refShareRatio, setRefShareRatio] = useState(initShareRatio);
      const [refRate, setRefRate] = useState(initRefRate);
      const [resetPwd, setResetPwd] = useState("");
      const [accStatus, setAccStatus] = useState(account.status);
      const [accType, setAccType] = useState(account.accountType);
      const [opPwd, setOpPwd] = useState("");
      const [err, setErr] = useState("");

      // 账号类型升降级规则: 游戏 → 代理 (升级 OK) / 代理 → 游戏 (禁止) / 顶代 不可改
      const canChangeType = account.accountType === "游戏";

      // 高敏感字段是否被改动 (顶代不算占成/佣金率, 因为该字段不显示)
      const highSensitive = (!isTop && refShareRatio !== initShareRatio) || (!isTop && refRate !== initRefRate) || resetPwd !== "" || accStatus !== account.status || accType !== account.accountType;

      const submit = () => {
        if (!nick.trim()) { setErr("请输入账户昵称"); return; }
        if (!isTop) {
          if (refShareRatio !== "" && isNaN(+refShareRatio)) { setErr("参考占成必须是数字"); return; }
          if (refShareRatio !== "" && rateUpperPct != null && +refShareRatio > +rateUpperPct) { setErr("参考占成不能超过上限 " + rateUpperPct + "%"); return; }
          if (refRate !== "" && isNaN(+refRate)) { setErr("参考佣金率必须是数字"); return; }
        }
        if (highSensitive && !opPwd) { setErr("修改了高敏感字段,请输入操作密码"); return; }
        if (highSensitive && opPwd !== "123456") { setErr("操作密码错误"); return; }
        onSubmit({
          nick, phone, phone2,
          accountType: accType,
          shareRatio: isTop ? account.shareRatio : (refShareRatio === "" ? null : (+refShareRatio / 100)),
          refRate: isTop ? account.refRate : (refRate === "" ? null : (+refRate / 100)),
          status: accStatus,
          resetPwd: resetPwd || null,  // 修 bug (Sammy 2026-04-30 challenge): 之前 onSubmit 没回传 resetPwd, 重置密码字段相当于无效
        });
      };

      return (
        <div className="modal-backdrop">
          <div className="modal modal-wide" onClick={e=>e.stopPropagation()}>
            <h3 className="text-base font-semibold mb-1">修改资料:{account.user}</h3>
            <p className="text-xs text-faint mb-4">沿用 B 端 V1.12 EditProfileModal 字段集 · 高敏感字段才触发操作密码</p>
            <div className="space-y-3">
              <div className="section-title">只读信息</div>
              <div className="bg-card border border-line rounded p-3 text-xs grid grid-cols-3 gap-2">
                <div><span className="text-muted">系统户口号:</span> <span className="mono text-cool">{account.sysId}</span></div>
                <div><span className="text-muted">用户账号:</span> <span className="mono">{account.user}</span></div>
                <div><span className="text-muted">币种:</span> <span className="chip chip-cool">{account.currency}</span></div>
                <div><span className="text-muted">账号类型:</span> {account.accountType}</div>
                <div><span className="text-muted">创建时间:</span> {account.createdAt}</div>
                <div><span className="text-muted">余额:</span> <span className="num">{fmtAmount(account.balance)}</span></div>
              </div>

              <div className="section-title">低敏感字段(无需操作密码)</div>
              <div className="grid grid-cols-2 gap-3">
                <div><label className="block text-xs text-muted mb-1">账户昵称</label><input className="input" value={nick} onChange={e=>setNick(e.target.value)}/></div>
                <div><label className="block text-xs text-muted mb-1">电话号码</label><input className="input" value={phone} onChange={e=>setPhone(e.target.value)} placeholder="选填"/></div>
                <div><label className="block text-xs text-muted mb-1">备用电话</label><input className="input" value={phone2} onChange={e=>setPhone2(e.target.value)} placeholder="选填"/></div>
              </div>

              <div className="section-title">高敏感字段(修改时触发操作密码)</div>
              {/* V0.2 隐藏「参考占成」(Sammy 2026-04-30): 顶代提示文案也隐藏。后期重启把这块加回 */}
              {!isTop && (

    // 上下分弹窗 (独立组件 / 内部 state / 金额单位"万" / 提交回传 amountWan)
    function CreditDebitModal({ dir, account, accounts, onClose, onSubmit }) {
      const isCredit = dir === "credit";
      // 找直属上级 (从 accounts 反查)
      const parentNode = Object.values(accounts).find(n => n.children && n.children.includes(account.key));
      const [amount, setAmount] = useState("");
      const [opPwd, setOpPwd] = useState("");
      const [err, setErr] = useState("");
      const balanceWan = (account.balance || 0) / 10000;
      const parentBalanceWan = parentNode ? (parentNode.balance || 0) / 10000 : 0;
      const submit = () => {
        if (!parentNode) { setErr("找不到直属上级,无法上下分"); return; }
        const a = parseFloat(amount);
        if (!a || a <= 0 || isNaN(a)) { setErr("请输入正确金额(单位 万)"); return; }
        if (isCredit && a > parentBalanceWan) { setErr("上分金额不能超过直属上级当前余额 " + fmtAmount(parentNode.balance) + " " + account.currency); return; }
        if (!isCredit && a > balanceWan) { setErr("下分金额不能超过当前余额 " + fmtAmount(account.balance) + " " + account.currency); return; }
        if (opPwd !== "123456") { setErr("操作密码错误"); return; }
        onSubmit(a);
      };
      return (
        <div className="modal-backdrop">
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <h3 className="text-base font-semibold mb-1">{isCredit ? "上分" : "下分"}:{account.user} · {account.currency}</h3>
            <p className="text-xs text-faint mb-4">{isCredit ? "上级 → 当前账号" : "当前账号 → 上级"} · 操作密码二次确认</p>
            <div className="space-y-3">
              {/* 资金流方向: 直属上级 ↔ 当前账号 */}
              <div className="grid grid-cols-2 gap-2 text-xs">
                <div className="bg-card border border-line rounded p-3" style={isCredit ? {borderColor:"#5BC97C"} : {}}>
                  <div className="text-faint" style={{fontSize:10,marginBottom:4}}>{isCredit ? "▶ 资金来源(直属上级)" : "◀ 资金去向(直属上级)"}</div>
                  {parentNode ? <>
                    <div>{parentNode.accountType}:<span className="mono text-cool">{parentNode.user}</span></div>
                    <div className="mt-1 text-muted">系统户口号:<span className="mono">{parentNode.sysId}</span></div>
                    <div className="mt-1 text-muted">当前余额:<span className="num">{fmtAmount(parentNode.balance) + " " + parentNode.currency}</span></div>
                  </> : <div className="text-faint">(无直属上级,无法上下分)</div>}
                </div>
                <div className="bg-card border border-line rounded p-3" style={!isCredit ? {borderColor:"#FF8B6B"} : {}}>
                  <div className="text-faint" style={{fontSize:10,marginBottom:4}}>{isCredit ? "◀ 资金去向(当前账号)" : "▶ 资金来源(当前账号)"}</div>
                  <div>{account.accountType}:<span className="mono text-cool">{account.user}</span></div>
                  <div className="mt-1 text-muted">系统户口号:<span className="mono">{account.sysId}</span></div>
                  <div className="mt-1 text-muted">当前余额:<span className="num">{fmtAmount(account.balance) + " " + account.currency}</span></div>
                </div>
              </div>
              <div>
                <label className="block text-xs text-muted mb-1">{isCredit ? "上分金额" : "下分金额"} <span style={{color:"#FF6B6B"}}>*</span></label>
                <div className="flex items-center gap-2">
                  <input type="number" step="0.0001" className="input flex-1" value={amount} onChange={e=>setAmount(e.target.value)} placeholder={isCredit ? "上限 " + parentBalanceWan.toLocaleString("zh-CN",{maximumFractionDigits:4}) + " (上级余额)" : "上限 " + balanceWan.toLocaleString("zh-CN",{maximumFractionDigits:4}) + " (当前余额)"}/>
                  <span className="text-muted">万 {account.currency}</span>
                </div>
                <div className="text-faint mt-1" style={{fontSize:11}}>
                  {isCredit ? "上分: 直属上级余额 -X, 当前账号余额 +X (整树总线余额不变)" : "下分: 当前账号余额 -X, 直属上级余额 +X (整树总线余额不变)"}
                </div>
              </div>
              <div>
                <label className="block text-xs text-muted mb-1">操作密码 <span style={{color:"#FF6B6B"}}>*</span></label>
                <input type="password" className="input" placeholder="当前登录员工的登录密码 (Mock: 123456)" value={opPwd} onChange={e=>setOpPwd(e.target.value)}/>
              </div>
              {err && <div className="text-xs" style={{color:"#FF6B6B"}}>{err}</div>}
            </div>
            <div className="flex justify-end gap-2 mt-5">
              <button className="btn btn-ghost" onClick={onClose}>取消</button>
              <button className="btn btn-primary" onClick={submit} disabled={!parentNode}>确认提交</button>
            </div>
          </div>
        </div>
      );

    // ============== 修改密码弹窗 ==============
    function ChangePwdModal({ user, onClose, onConfirm }) {
      const [oldPwd, setOldPwd] = useState("");
      const [newPwd, setNewPwd] = useState("");
      const [newPwdC, setNewPwdC] = useState("");
      const [err, setErr] = useState("");
      const submit = () => {
        if (oldPwd !== "123456") { setErr("原密码错误"); return; }
        if (!newPwd || newPwd.length < 6) { setErr("新密码至少 6 位"); return; }
        if (newPwd === oldPwd) { setErr("新密码不能跟原密码相同"); return; }
        if (newPwd !== newPwdC) { setErr("两次新密码不一致"); return; }
        onConfirm();
      };
      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e=>e.stopPropagation()} style={{width:420}}>
            <h3 className="text-base font-semibold mb-1">修改登录密码</h3>
            <p className="text-xs text-faint mb-4">当前账号 <span className="mono text-cool">{user.user}</span> · 修改后需重新登录</p>
            <div className="mb-3">
              <label className="block text-xs text-muted mb-1">原密码</label>
              <input className="input" type="password" value={oldPwd} onChange={e=>setOldPwd(e.target.value)} placeholder="请输入原密码" autoFocus/>
            </div>
            <div className="mb-3">
              <label className="block text-xs text-muted mb-1">新密码</label>
              <input className="input" type="password" value={newPwd} onChange={e=>setNewPwd(e.target.value)} placeholder="至少 6 位"/>
            </div>
            <div className="mb-3">
              <label className="block text-xs text-muted mb-1">确认新密码</label>
              <input className="input" type="password" value={newPwdC} onChange={e=>setNewPwdC(e.target.value)} placeholder="再次输入新密码"/>

        setShowAdd(false);
        appendSystemLog && appendSystemLog("新增员工", data.user+" / 角色 "+ROLES[data.role].name);

      const handleDel = (s) => {
        if (s.user === "admin") { alert("⚠ admin 是系统超级账号\nadmin 不可删除,确保始终至少有 1 个 operator 能管理系统"); return; }

            </div>
            <button className="btn btn-primary" onClick={()=>setShowAdd(true)} style={{padding:"8px 18px"}}>+ 新增员工</button>

            <div className="scroll-x">
              <table>
                <thead><tr>
                  <th>员工账号</th><th>角色</th><th>电话</th><th>创建时间</th><th>最近登录</th><th>操作</th>
                </tr></thead>
                <tbody>
                  {staff.map(s => (
                    <tr key={s.user}>
                      <td className="mono">{s.user}{s.user === currentUser.user && <span className="text-faint ml-2" style={{fontSize:10}}>(当前登录)</span>}{s.user === "admin" && <span className="ml-2" style={{fontSize:10,color:"#F0B93A"}}>★ 超级账号</span>}</td>
                      <td><span className="chip" style={{background:ROLES[s.role].color+"22",color:ROLES[s.role].color}}>{ROLES[s.role].name}</span></td>
                      <td className="mono text-muted" style={{fontSize:12}}>{s.phone}</td>
                      <td className="text-muted" style={{fontSize:12}}>{s.createdAt}</td>
                      <td className="text-muted" style={{fontSize:12}}>{s.lastLogin}</td>
                      <td>
                        <button className="btn btn-ghost" style={{padding:"4px 10px",fontSize:11,marginRight:4}} onClick={()=>setEditRoleModal(s)} disabled={s.user === currentUser.user || s.user === "admin"} title={s.user === "admin" ? "admin 是系统超级账号,角色不可修改" : ""}>修改角色</button>
                        <button className="btn btn-ghost" style={{padding:"4px 10px",fontSize:11,color:"#FF6B6B"}} onClick={()=>setDelConfirm(s)} disabled={s.user === currentUser.user || s.user === "admin"} title={s.user === "admin" ? "admin 是系统超级账号,不可删除" : ""}>删除</button>
                      </td>

                  ))}
                </tbody>

          </div>
          {showAdd && <AddStaffModal onClose={()=>setShowAdd(false)} onSubmit={handleAdd}/>}

              <div className="modal" onClick={e=>e.stopPropagation()} style={{width:420}}>
                <h3 className="text-base font-semibold mb-3">确认删除员工?</h3>
                <p className="text-sm text-muted mb-4">确认删除 <span className="mono text-cool">{delConfirm.user}</span> ({ROLES[delConfirm.role].name}) ?该员工将无法登录系统,历史操作日志保留。</p>
                <div className="flex justify-end gap-2">

                  <button className="btn btn-primary" style={{background:"#FF6B6B",borderColor:"#FF6B6B"}} onClick={()=>handleDel(delConfirm)}>确认删除</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ============== IP 白名单页 (系统管理 / IP 白名单) ==============
    // V0.2 完整功能 (Sammy 2026-04-30 拍): 增删改启停 + 操作密码二次校验 + 防自锁 + 当前 IP 提示 + 命中拒登 (LoginPage 校验)
    function IPWhitelistPage({ list, setList, currentLoginIP, appendSystemLog }) {
      const [showAdd, setShowAdd] = useState(false);
      const [confirmAction, setConfirmAction] = useState(null);  // { type:"toggle"|"delete", item }
      const [opPwd, setOpPwd] = useState("");
      const [opErr, setOpErr] = useState("");

      // 筛选 (提交触发, 跟其他列表页一致)
      const [inIP, setInIP] = useState(""), [ipQ, setIpQ] = useState("");
      const [inStatus, setInStatus] = useState("all"), [statusQ, setStatusQ] = useState("all");
      const [pageNum, setPageNum] = useState(0);
      const doSearch = () => { setIpQ(inIP.trim()); setStatusQ(inStatus); setPageNum(0); };
      const resetSearch = () => { setInIP(""); setInStatus("all"); setIpQ(""); setStatusQ("all"); setPageNum(0); };

      const filtered = list.filter(w => {
        if (ipQ && !w.ip.includes(ipQ) && !(w.label || "").includes(ipQ)) return false;
        if (statusQ === "enabled" && !w.enabled) return false;
        if (statusQ === "disabled" && w.enabled) return false;
        return true;
      });

      const enabledCount = list.filter(w => w.enabled).length;
      const isCurrentIPAllowed = enabledCount === 0 || list.filter(w => w.enabled).some(w => ipMatches(currentLoginIP, w.ip));

      const doConfirm = () => {
        if (opPwd !== "123456") { setOpErr("操作密码错误"); return; }
        const { type, item } = confirmAction;
        if (type === "toggle") {
          // 防自锁:不能停用最后一条启用项 (会导致所有 IP 都拒登,包括当前登录员工)
          if (item.enabled && enabledCount === 1) {
            setOpErr("不能停用最后一条启用的白名单(否则所有 IP 都将拒登)"); return;
          }
          setList(list.map(w => w.id === item.id ? { ...w, enabled: !w.enabled } : w));
          appendSystemLog && appendSystemLog((item.enabled ? "停用" : "启用")+" IP 白名单", item.ip+" ("+item.label+")");
        } else if (type === "delete") {
          if (item.enabled && enabledCount === 1) {
            setOpErr("不能删除最后一条启用的白名单(否则所有 IP 都将拒登)"); return;
          }
          setList(list.filter(w => w.id !== item.id));
          appendSystemLog && appendSystemLog("删除 IP 白名单", item.ip+" ("+item.label+")");
        }
        setConfirmAction(null); setOpPwd(""); setOpErr("");
      };

      const handleAdd = (data) => {
        const maxId = list.reduce((m, w) => Math.max(m, w.id), 0);
        const now = new Date(); const pad = (n) => String(n).padStart(2,"0");
        const createdAt = now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate())+" "+pad(now.getHours())+":"+pad(now.getMinutes())+":"+pad(now.getSeconds());
        setList([...list, { id: maxId+1, ip:data.ip, label:data.label, enabled:data.enabled, createdAt }]);
        setShowAdd(false);
        appendSystemLog && appendSystemLog("新增 IP 白名单", data.ip+" ("+data.label+", "+(data.enabled?"启用":"已停用")+")");
      };

      return (
        <div className="p-6">
          <div className="flex items-center justify-between mb-5">
            <div>
              <h2 className="text-xl font-semibold">IP 白名单</h2>
              <p className="text-xs text-muted mt-1">仅 operator 可见 · 限定哪些 IP 段可登录总控后台 · 命中白名单外 IP 直接拒登</p>
            </div>
            <button className="btn btn-primary" onClick={()=>setShowAdd(true)} style={{padding:"8px 18px"}}>+ 新增白名单</button>
          </div>
          <div className="bg-cool-soft border border-cool rounded-lg p-3 mb-4 text-xs flex items-start gap-2">
            <span className="text-cool" style={{marginTop:1}}>ℹ</span>
            <span>
              <b>当前登录 IP:</b> <span className="mono text-cool">{currentLoginIP}</span> {isCurrentIPAllowed ? <span style={{color:"#5BC97C"}}>✓ 在白名单内</span> : <span style={{color:"#FF6B6B"}}>✗ 不在白名单内 (下次登录将被拒)</span>}
              {" "}· <b>启用项 {enabledCount} 条</b>(0 条 = 所有 IP 均可登录)· 校验范围:LoginPage 提交时;停用 / 删除最后一条启用项有防自锁拦截
            </span>
          </div>
          <div className="bg-panel border border-line rounded-lg p-3 mb-4">
            <div className="flex flex-wrap gap-2 items-center">
              <input className="input mono" style={{width:280,fontSize:13}} placeholder="搜索 IP / IP 段 / 备注" value={inIP} onChange={e=>setInIP(e.target.value)} onKeyDown={e=>{if(e.key==="Enter") doSearch();}}/>
              <select className="input" style={{width:120}} value={inStatus} onChange={e=>setInStatus(e.target.value)}>
                <option value="all">全部状态</option>
                <option value="enabled">启用</option>
                <option value="disabled">已停用</option>
              </select>
              <button className="btn btn-primary" style={{padding:"8px 18px"}} onClick={doSearch}>搜索</button>
              <button className="btn btn-ghost" style={{padding:"8px 14px"}} onClick={resetSearch}>重置</button>
            </div>
            <div className="flex items-center mt-2 text-xs text-faint">
              <span>共 {filtered.length} 条</span>
            </div>
          </div>
          <div className="bg-panel border border-line rounded-lg overflow-hidden">
            <div className="scroll-x">
              <table>
                <thead><tr>
                  <th>IP / IP 段</th><th>备注</th><th>状态</th><th>创建时间</th><th>操作</th>
                </tr></thead>
                <tbody>
                  {filtered.slice(pageNum*PAGE_SIZE, (pageNum+1)*PAGE_SIZE).map(item => (
                    <tr key={item.id}>
                      <td className="mono">{item.ip}</td>
                      <td className="text-muted" style={{fontSize:12}}>{item.label}</td>
                      <td><span className={"chip " + (item.enabled ? "chip-active" : "chip-frozen")}>{item.enabled ? "启用" : "已停用"}</span></td>
                      <td className="text-muted" style={{fontSize:12}}>{item.createdAt}</td>
                      <td>
                        <button className="btn btn-ghost" style={{padding:"4px 10px",fontSize:11,marginRight:4}} onClick={()=>{setConfirmAction({type:"toggle",item}); setOpPwd(""); setOpErr("");}}>{item.enabled ? "停用" : "启用"}</button>
                        <button className="btn btn-ghost" style={{padding:"4px 10px",fontSize:11,color:"#FF6B6B"}} onClick={()=>{setConfirmAction({type:"delete",item}); setOpPwd(""); setOpErr("");}}>删除</button>
                      </td>
                    </tr>
                  ))}
                  {filtered.length === 0 && <tr><td colSpan="5" style={{textAlign:"center",padding:"20px",color:"#6B7280"}}>{list.length === 0 ? "暂无白名单(所有 IP 均可登录)" : "无匹配数据"}</td></tr>}
                </tbody>
              </table>
            </div>
            <Pagination total={filtered.length} pageNum={pageNum} setPageNum={setPageNum}/>
          </div>
          {showAdd && <AddIPModal onClose={()=>setShowAdd(false)} onSubmit={handleAdd} existingIPs={list.map(w=>w.ip)}/>}
          {confirmAction && (
            <div className="modal-backdrop" onClick={()=>{setConfirmAction(null); setOpPwd(""); setOpErr("");}}>
              <div className="modal" onClick={e=>e.stopPropagation()} style={{width:440}}>
                <h3 className="text-base font-semibold mb-3">{confirmAction.type === "toggle" ? (confirmAction.item.enabled ? "确认停用?" : "确认启用?") : "确认删除?"}</h3>
                <p className="text-sm text-muted mb-4">
                  {confirmAction.type === "toggle"
                    ? <>{confirmAction.item.enabled ? "停用" : "启用"} <span className="mono text-cool">{confirmAction.item.ip}</span> ({confirmAction.item.label})</>
                    : <>删除 <span className="mono text-cool">{confirmAction.item.ip}</span> ({confirmAction.item.label}),无法恢复</>
                  }
                </p>
                <div className="mb-3">
                  <label className="block text-xs text-muted mb-1">操作密码 <span style={{color:"#FF6B6B"}}>*</span></label>
                  <input type="password" className="input" value={opPwd} onChange={e=>setOpPwd(e.target.value)} placeholder="当前登录员工的登录密码 (Mock: 123456)" autoFocus/>
                </div>
                {opErr && <div className="text-xs mb-3" style={{color:"#FF6B6B"}}>{opErr}</div>}
                <div className="flex justify-end gap-2 mt-4">
                  <button className="btn btn-ghost" onClick={()=>{setConfirmAction(null); setOpPwd(""); setOpErr("");}}>取消</button>
                  <button className="btn btn-primary" style={confirmAction.type === "delete" ? {background:"#FF6B6B",borderColor:"#FF6B6B"} : {}} onClick={doConfirm}>确认</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function AddIPModal({ onClose, onSubmit, existingIPs }) {
      const [ip, setIP] = useState("");
      const [label, setLabel] = useState("");
      const [enabled, setEnabled] = useState(true);
      const [opPwd, setOpPwd] = useState("");
      const [err, setErr] = useState("");
      const submit = () => {
        const ipTrim = ip.trim();
        if (!ipTrim) { setErr("请输入 IP 或 IP 段"); return; }
        if (!isValidIPOrCIDR(ipTrim)) { setErr("格式不合法,例:192.168.1.1 或 10.4.2.0/24"); return; }
        if (existingIPs.includes(ipTrim)) { setErr("已存在该 IP / IP 段"); return; }
        if (!label.trim()) { setErr("请输入备注(便于后期管理)"); return; }
        if (opPwd !== "123456") { setErr("操作密码错误"); return; }
        onSubmit({ ip: ipTrim, label: label.trim(), enabled });
      };
      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e=>e.stopPropagation()} style={{width:480}}>
            <h3 className="text-base font-semibold mb-1">新增 IP 白名单</h3>
            <p className="text-xs text-faint mb-4">支持单 IP(192.168.1.1)或 CIDR 段(10.4.2.0/24)</p>
            <div className="mb-3"><label className="block text-xs text-muted mb-1">IP / IP 段 <span style={{color:"#FF6B6B"}}>*</span></label><input className="input mono" value={ip} onChange={e=>setIP(e.target.value)} placeholder="例: 192.168.1.1 或 10.4.2.0/24" autoFocus/></div>
            <div className="mb-3"><label className="block text-xs text-muted mb-1">备注 <span style={{color:"#FF6B6B"}}>*</span></label><input className="input" value={label} onChange={e=>setLabel(e.target.value)} placeholder="例: 办公网段 / 运营 admin 家用"/></div>
            <div className="mb-3">
              <label className="block text-xs text-muted mb-1">初始状态</label>
              <div className="flex gap-4 text-sm" style={{paddingTop:6}}>
                <label><input type="radio" checked={enabled} onChange={()=>setEnabled(true)}/> <span className="ml-1">启用</span></label>
                <label><input type="radio" checked={!enabled} onChange={()=>setEnabled(false)}/> <span className="ml-1">已停用</span></label>
              </div>
            </div>
            <div className="mb-3"><label className="block text-xs text-muted mb-1">操作密码 <span style={{color:"#FF6B6B"}}>*</span></label><input type="password" className="input" value={opPwd} onChange={e=>setOpPwd(e.target.value)} placeholder="当前登录员工的登录密码 (Mock: 123456)"/></div>
            {err && <div className="text-xs mb-3" style={{color:"#FF6B6B"}}>{err}</div>}
            <div className="flex justify-end gap-2 mt-4">
              <button className="btn btn-ghost" onClick={onClose}>取消</button>
              <button className="btn btn-primary" onClick={submit}>确认新增</button>
            </div>
          </div>
        </div>
      );
    }

    // ============== 数据看板 (V0.2 简洁版门户页) ==============
    function DashboardPage({ role, auditSystem, setActive, accounts }) {
      const r = ROLES[role];
      // 按"人"算顶代户口数 (Sammy 2026-04-30 拍): 1 顶代多币种 = 多行, 但只算 1 个人 (distinct user)
      // 启用 / 冻结状态:任一币种行 active 就算"启用人",全部行都 frozen 才算"冻结人"
      // accounts 由 App 层 lift (V0.2 修 bug): 顶代被冻结 / 上下分余额变化都立即反映到 KPI
      const topAgentRows = Object.values(accounts).filter(a => a.accountType === "普通(顶代)");
      const topAgentUsers = {};  // user → { hasActive }
      topAgentRows.forEach(a => {
        if (!topAgentUsers[a.user]) topAgentUsers[a.user] = { hasActive: false };
        if (a.status === "active") topAgentUsers[a.user].hasActive = true;
      });
      const topAgentPeople = Object.keys(topAgentUsers).length;
      const topActivePeople = Object.values(topAgentUsers).filter(u => u.hasActive).length;
      const totalSessions = MOCK_SPORTS_SESSIONS.filter(s => (s.validStake||0) > 0).length;
      const todayBets = MOCK_BETS.filter(b => b.gameType.includes("体育") && b.status === "已结算").length;
      const recent = auditSystem.slice(0, 10);
      const Card = ({ label, value, sub, color }) => (
        <div className="bg-panel border border-line rounded-lg p-4">
          <div className="text-xs text-muted mb-2">{label}</div>
          <div className="num text-2xl font-semibold" style={{color: color || "#E4ECF7"}}>{value}</div>
          {sub && <div className="text-xs text-faint mt-1">{sub}</div>}
        </div>
      );
      return (
        <div className="p-6">
          <div className="mb-5">
            <h2 className="text-xl font-semibold">数据看板</h2>
            <p className="text-xs text-muted mt-1">V0.2 简洁版概览  ·  欢迎 <span className="text-cool">{r.name}</span>  ·  完整指标版本待 Q-S2 议</p>
          </div>
          <div className="grid grid-cols-4 gap-4 mb-5">
            <Card label="顶代户口数" value={topAgentPeople+" 人"} sub={"启用 "+topActivePeople+" / 冻结 "+(topAgentPeople-topActivePeople)+"  ·  共 "+topAgentRows.length+" 行(多币种拆分)"} color="#4A9EFF"/>
            <Card label="累计体育场次" value={totalSessions+" 条"} sub="跨日已结算" color="#5BC97C"/>
            <Card label="累计已结算注单" value={todayBets+" 条"} sub="体育游戏" color="#F0B93A"/>
            <Card label="最近系统动作" value={auditSystem.length+" 条"} sub="点下方查看明细" color="#9B7FE8"/>
          </div>
          <div className="bg-panel border border-line rounded-lg overflow-hidden">
            <div className="flex items-center justify-between px-5 py-3 border-b border-line">
              <div className="font-semibold text-sm">最近系统动作 · 最新 {recent.length} 条</div>
              <button className="btn btn-ghost" style={{padding:"4px 12px",fontSize:11}} onClick={()=>setActive("sys.audit")}>查看完整日志 →</button>
            </div>
            <div className="scroll-x">
              <table>
                <thead><tr><th>时间</th><th>员工</th><th>动作</th><th>目标</th></tr></thead>
                <tbody>
                  {recent.map((r, i) => (
                    <tr key={i}>
                      <td className="text-muted" style={{fontSize:12}}>{r.time}</td>
                      <td className="mono">{r.actor}</td>
                      <td><span className="chip chip-cool" style={{fontSize:10}}>{r.action}</span></td>
                      <td className="text-muted" style={{fontSize:12}}>{r.target}</td>
                    </tr>
                  ))}
                  {recent.length === 0 && <tr><td colSpan="4" style={{textAlign:"center",padding:"30px",color:"#6B7280"}}>暂无动作记录</td></tr>}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ============== 主框架 ==============
    function App() {
      // ⚠ React Hooks 规则: 所有 hooks 必须在 early return 之前,且每次 render 调用顺序一致
      const [currentUser, setCurrentUser] = useState(null);  // null = 未登录
      const [loginIP, setLoginIP] = useState(null);          // 登录时记录的 IP, 给右上块 / 操作日志展示
      const [active, setActive] = useState("agents");  // V0.2 收尾: dashboard 隐藏后默认进顶代户口
      const [showChangePwd, setShowChangePwd] = useState(false);
      const [showUserMenu, setShowUserMenu] = useState(false);
      const [ipWhitelist, setIpWhitelist] = useState(() => [...INITIAL_IPWHITE]);
      const [auditSystem, setAuditSystem] = useState(() => [...INITIAL_AUDIT_SYSTEM]);
      const [auditPlayer, setAuditPlayer] = useState(() => [...INITIAL_AUDIT_PLAYER]);
      // V0.2 修 bug (Sammy 2026-04-30): accounts / topKeys / staff lift 到 App 层
      // 避免切菜单 unmount 子组件时 mock state 销毁 (顶代余额改了切走再回来就回退、新员工不能登录等)
      const [accounts, setAccounts] = useState(() => ({...ACCOUNTS}));
      const [topKeys, setTopKeys] = useState(() => [...TOP_AGENT_KEYS]);
      const [staff, setStaff] = useState(() => [...INITIAL_STAFF]);

      // 写动作回写系统操作日志 (Sammy 2026-04-30 拍 A 方案):
      // 所有 S 端写动作都 unshift 一条到 auditSystem,真实演示动作 ↔ 日志的实时关联
      // user/ip 参数可选 (登录时 currentUser 还没 setState, 显式传)
      const appendSystemLog = (action, target, extra = {}) => {
        const user = extra.user || currentUser;
        const ip = extra.ip || loginIP || "10.4.2.18";
        if (!user) return;
        const now = new Date(); const pad = (n) => String(n).padStart(2,"0");
        const time = now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate())+" "+pad(now.getHours())+":"+pad(now.getMinutes())+":"+pad(now.getSeconds());
        setAuditSystem(prev => [{
          time, actorType:"员工", actor: user.user+" ("+user.role+")",
          action, target, ip, reason: extra.reason || "-",
        }, ...prev]);
      };

      const role = currentUser ? currentUser.role : null;
      const r = role ? ROLES[role] : null;
      const visibleMenus = r ? r.menus : [];

      // 角色变化兜底:若当前菜单不可见,回退到第一个可见菜单
      React.useEffect(() => {
        if (currentUser && !visibleMenus.includes(active)) setActive(visibleMenus[0]);
      }, [role]);

      // 所有 hooks 调用完毕后再 early return (避免登录前后 hook 数量不一致引发 React 报错)
      if (!currentUser) return <LoginPage onLogin={(s, ip)=>{
        // 更新 staff 表里该员工的 lastLogin 为本次登录时间, 同步刷新 currentUser 副本 (右上块下拉 / StaffPage 列 都用得到)
        const now = new Date(); const pad = (n) => String(n).padStart(2,"0");
        const nowStr = now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate())+" "+pad(now.getHours())+":"+pad(now.getMinutes())+":"+pad(now.getSeconds());
        const fresh = { ...s, lastLogin: nowStr };
        setStaff(staff.map(x => x.user === s.user ? fresh : x));
        setCurrentUser(fresh); setLoginIP(ip);
        appendSystemLog("登录", "S 端 / 角色: "+s.role, { user: fresh, ip });
      }} staffList={staff}/>;

      const Menu = ({ id, label, icon }) => visibleMenus.includes(id) && (
        <div className={"menu-item " + (active===id?"active":"")} onClick={()=>setActive(id)}>
          <span style={{width:14}}>{icon}</span>{label}
        </div>
      );

      const breadcrumb = {
        "dashboard":"数据看板",
        "agents":"账号管理 / 顶代户口",
        "reports.bets":"报表管理 / 体育注单记录",
        "reports.sports":"报表管理 / 体育场次记录",
        "reports.ledger":"报表管理 / 交易流水记录",
        "perm.staff":"权限管理 / 员工账号",
        "sys.audit":"系统管理 / 操作日志",
        "sys.ipwhite":"系统管理 / IP 白名单",
      }[active];

      return (
        <div className="flex min-h-screen">
          {/* Sidebar */}
          <aside className="w-56 bg-panel border-r border-line flex flex-col">
            <div className="px-5 py-5 border-b border-line">
              <div className="flex items-center gap-2">
                <span className="text-cool text-lg">◆</span>
                <span className="font-semibold tracking-wider" style={{letterSpacing:2}}>三方游戏</span>
              </div>
              <div className="text-xs text-faint mt-1 ml-5">总控后台 V0.2</div>
            </div>
            <nav className="flex-1 px-3 py-3 overflow-y-auto">
              {/* V0.2 收尾 (Sammy 2026-04-30 拍): 数据看板 / IP 白名单 菜单隐藏 (代码保留 in App, 后期重启时把 ROLES.menus 加回 + 这里 Menu 加回即可) */}

              <div className="menu-group">账号管理</div>
              <Menu id="agents" label="顶代户口" icon="◉"/>

              <div className="menu-group">报表管理</div>
              <Menu id="reports.bets" label="体育注单记录" icon="◐"/>
              <Menu id="reports.sports" label="体育场次记录" icon="◑"/>
              <Menu id="reports.ledger" label="交易流水记录" icon="◒"/>

              {visibleMenus.includes("perm.staff") && <div className="menu-group">权限管理</div>}
              <Menu id="perm.staff" label="员工账号" icon="◆"/>

              <div className="menu-group">系统管理</div>
              <Menu id="sys.audit" label="操作日志" icon="◓"/>
            </nav>
            <div className="px-4 py-3 border-t border-line text-xs text-faint">
              <div>内部工具 · 仅限授权员工</div>
              <div className="mt-1" style={{fontSize:10,color:"#5C6878"}}>原型仅评审用 · 实际开发使用 @ant-design/pro-components</div>
            </div>
          </aside>

          {/* Main */}
          <main className="flex-1 flex flex-col bg-app">
            <header className="border-b border-line px-6 py-3 flex items-center bg-panel" style={{justifyContent:"space-between"}}>
              <div className="text-xs text-faint">{breadcrumb}</div>
              {/* 右上员工信息块 */}
              <div style={{position:"relative"}}>
                <div className="flex items-center gap-2 cursor-pointer" onClick={()=>setShowUserMenu(!showUserMenu)} style={{padding:"4px 10px",borderRadius:6,background:showUserMenu?"#1A2434":"transparent"}}>
                  <span style={{width:24,height:24,borderRadius:"50%",background:r.color,color:"#0B0F15",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:600}}>{currentUser.user[0].toUpperCase()}</span>
                  <span className="text-xs">{currentUser.user}</span>
                  <span className="chip" style={{background:r.color+"22",color:r.color,fontSize:10}}>{r.name}</span>
                  <span className="text-faint" style={{fontSize:10}}>▾</span>
                </div>
                {showUserMenu && (
                  <div className="bg-panel border border-line rounded-lg" style={{position:"absolute",top:"100%",right:0,marginTop:4,minWidth:180,padding:"6px 0",zIndex:30,boxShadow:"0 4px 12px rgba(0,0,0,0.4)"}}>
                    <div className="px-4 py-2 text-xs text-faint border-b border-line">{currentUser.phone || "-"}</div>
                    <div className="px-4 py-2 text-xs text-faint border-b border-line">最近登录: <span className="mono">{currentUser.lastLogin || "-"}</span></div>
                    <div className="px-4 py-2 cursor-pointer hover:bg-app text-sm" style={{cursor:"pointer"}} onClick={()=>{setShowChangePwd(true); setShowUserMenu(false);}}>修改密码</div>
                    <div className="px-4 py-2 cursor-pointer hover:bg-app text-sm" style={{cursor:"pointer",color:"#FF8B6B"}} onClick={()=>{if(confirm("确认退出登录?")){appendSystemLog("登出","S 端 / 角色: "+role); setCurrentUser(null); setShowUserMenu(false);}}}>退出登录</div>
                  </div>
                )}
              </div>
            </header>
            <div className="flex-1 overflow-auto">
              {active === "dashboard" && <DashboardPage role={role} auditSystem={auditSystem} setActive={setActive} accounts={accounts}/>}
              {active === "agents" && <AgentsPage role={role} canWrite={r.canWrite} appendSystemLog={appendSystemLog} accounts={accounts} setAccounts={setAccounts} topKeys={topKeys} setTopKeys={setTopKeys}/>}
              {active === "reports.bets" && <BetsPage role={role} appendSystemLog={appendSystemLog}/>}
              {active === "reports.sports" && <SportsSessionsPage role={role} appendSystemLog={appendSystemLog}/>}
              {active === "reports.ledger" && <LedgerPage role={role} appendSystemLog={appendSystemLog}/>}
              {active === "perm.staff" && <StaffPage currentUser={currentUser} appendSystemLog={appendSystemLog} staff={staff} setStaff={setStaff}/>}
              {active === "sys.audit" && <AuditPage role={role} system={auditSystem} player={auditPlayer}/>}
              {active === "sys.ipwhite" && <IPWhitelistPage list={ipWhitelist} setList={setIpWhitelist} currentLoginIP={loginIP || "10.4.2.18"} appendSystemLog={appendSystemLog}/>}
            </div>
          </main>
          {showChangePwd && <ChangePwdModal user={currentUser} onClose={()=>setShowChangePwd(false)} onConfirm={()=>{
            appendSystemLog("修改密码", "自身账号 "+currentUser.user+" (强制重登)");
            appendSystemLog("登出", "S 端 / 角色: "+role+" (改密强制)");
            setShowChangePwd(false); alert("密码修改成功,请用新密码重新登录"); setCurrentUser(null);
          }}/>}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
