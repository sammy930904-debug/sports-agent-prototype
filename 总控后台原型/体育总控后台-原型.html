<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>三方游戏总控后台 · 原型</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- 局部破例: 仅开户时间用 antd 4 RangePicker (native datetime-local 体验不够) -->
  <link rel="stylesheet" href="https://unpkg.com/antd@4.24.16/dist/antd.dark.min.css">
  <script src="https://unpkg.com/moment@2.30.1/min/moment-with-locales.min.js"></script>
  <script src="https://unpkg.com/antd@4.24.16/dist/antd-with-locales.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *{box-sizing:border-box}
    /* 防止 Mac trackpad 横向 swipe 触发浏览器 history.back, 导致 modal 被无故关闭 */
    html,body{overscroll-behavior-x:contain}
    html,body,#root{margin:0;padding:0;background:#0B0F15;color:#E6EAF0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
    .bg-app{background:#0B0F15}
    .bg-panel{background:#11161E}
    .bg-card{background:#1A2434}
    .bg-row-hover:hover{background:#1A2434}
    .border-line{border-color:#2A3648}
    .text-muted{color:#9AA4B5}
    .text-faint{color:#6B7280}
    .text-cool{color:#4A9EFF}
    .bg-cool{background:#4A9EFF}
    .bg-cool-soft{background:#0F1B2A}
    .border-cool{border-color:#4A9EFF}
    .ring-cool:focus{outline:2px solid #4A9EFF;outline-offset:1px}
    .btn{padding:8px 14px;border-radius:6px;font-size:13px;font-weight:500;transition:.15s;cursor:pointer;border:1px solid transparent}
    .btn-primary{background:#4A9EFF;color:#fff}
    .btn-primary:hover{background:#5FA8FF}
    .btn-primary:disabled{background:#2A3648;color:#6B7280;cursor:not-allowed}
    .btn-ghost{background:transparent;color:#E6EAF0;border-color:#2A3648}
    .btn-ghost:hover{border-color:#4A9EFF;color:#4A9EFF}
    .btn-danger{background:#3A1F23;color:#FF6B6B;border-color:#5A2D33}
    .btn-danger:hover{background:#5A2D33}
    .input{background:#0B0F15;border:1px solid #2A3648;border-radius:6px;padding:8px 12px;font-size:13px;color:#E6EAF0;width:100%}
    .input:focus{border-color:#4A9EFF;outline:none}
    .chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;font-weight:500}
    .chip-active{background:#0F2A1A;color:#5BC97C}
    .chip-frozen{background:#3A1F23;color:#FF6B6B}
    .chip-pending{background:#2A2415;color:#F0B93A}
    .chip-settled{background:#0F2A1A;color:#5BC97C}
    .chip-void{background:#2A2A30;color:#9AA4B5}
    .chip-cool{background:#0F1B2A;color:#4A9EFF}
    .chip-warn{background:#2A2415;color:#F0B93A}
    .chip-info{background:#1A2434;color:#9AA4B5}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th{text-align:left;padding:10px 12px;background:#0F141C;color:#9AA4B5;font-weight:500;border-bottom:1px solid #2A3648;white-space:nowrap}
    td{padding:10px 12px;border-bottom:1px solid #1F2733;white-space:nowrap}
    tr:hover td{background:#141B25}
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50}
    .modal{background:#11161E;border:1px solid #2A3648;border-radius:10px;padding:24px;width:480px;max-width:92vw;max-height:90vh;overflow:auto}
    .modal-wide{width:720px}
    .section-title{font-size:12px;color:#F0B93A;font-weight:600;margin:14px 0 8px 0}
    .section-title:first-child{margin-top:0}
    .menu-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:13px;color:#9AA4B5;transition:.15s}
    .menu-item:hover{background:#1A2434;color:#E6EAF0}
    .menu-item.active{background:#0F1B2A;color:#4A9EFF}
    .menu-group{font-size:11px;color:#6B7280;padding:14px 12px 6px;letter-spacing:1px;font-weight:500}
    .tab{padding:8px 16px;font-size:13px;color:#9AA4B5;cursor:pointer;border-bottom:2px solid transparent;transition:.15s}
    .tab.active{color:#4A9EFF;border-bottom-color:#4A9EFF}
    .scroll-x{overflow-x:auto}
    .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
    .mono{font-family:"SF Mono",Monaco,Consolas,monospace}
    /* V0.x 新增: 字段 hover tooltip (紫色 PM 提示, 给开发对接, 正式环境删除) */
    .field-hint{position:relative;cursor:help;border-bottom:1px dotted rgba(155,127,232,0.5)}
    /* Portal 把 bubble 渲染到 body, 不在 .field-hint 内, 所以选择器不带父级 */
    .field-hint-bubble{padding:10px 14px;background:#1A1428;border:2px solid #9B7FE8;border-radius:8px;color:#FFFFFF;font-size:12px;line-height:1.65;min-width:260px;max-width:360px;z-index:99999;text-align:left;white-space:normal;box-shadow:0 8px 32px rgba(0,0,0,0.85),0 0 0 4px rgba(155,127,232,0.15);pointer-events:none;font-weight:normal}
    .field-hint-bubble::before{content:"📝 业务规则";display:block;color:#C4A8FF;font-weight:700;margin-bottom:6px;font-size:11px;letter-spacing:.5px;padding-bottom:5px;border-bottom:1px solid rgba(155,127,232,0.4)}
    .field-hint-bubble::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:8px solid transparent;border-top-color:#9B7FE8}
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="js/app.js"></script>
</body>
</html>
